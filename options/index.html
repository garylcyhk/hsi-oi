<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../auth.js"></script>
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="apple-touch-icon" href="../favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>恒指期權未平倉 · Exodus Trading Group</title>
<style>
:root{--font-scale:100%;--bg:#09090b;--card:#18181b;--border:#27272a;--text:#fafafa;--muted:#a1a1aa;--emerald:#34d399;--rose:#fb7185}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:var(--font-scale)}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;max-width:100vw}
.container{width:100%;max-width:100%;margin:0 auto;padding:0;flex:1}
header{border-bottom:1px solid var(--border);background:rgba(24,24,27,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;padding:12px 0;width:100%}
header .inner{width:100%;max-width:100%;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.15rem;font-weight:600}h1 span{color:var(--muted);font-weight:400;font-size:.85rem}
.atm-header{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.75rem}
.atm-header .gf-item{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.atm-header select{background:#1c1c1f;color:var(--text);border:1px solid #333;border-radius:5px;padding:3px 6px;font-size:.72rem}
.atm-header input[type=checkbox]{accent-color:#34d399;width:14px;height:14px}
.tag{font-size:.7rem;color:var(--muted);white-space:nowrap}
.date-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-picker label{font-size:.75rem;color:var(--muted)}
.date-picker select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.8rem;font-family:ui-monospace,monospace}
.grid-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.card .label{font-size:.7rem;color:var(--muted);margin-bottom:4px}.card .value{font-size:1.15rem;font-weight:600}.card .subv{font-size:.75rem;margin-top:2px}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:auto;max-width:100%}
.section-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.section-header h2{font-size:.9rem;font-weight:500}.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:800px){.zones,.futures-bar,.cmp-grid{grid-template-columns:1fr!important}}
@media(min-width:1200px){.zones{grid-template-columns:1fr 1fr!important}}
table{width:100%;border-collapse:collapse;font-size:.85rem}th{text-align:left;padding:8px 12px;font-size:.7rem;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);background:var(--card)}td{padding:6px 12px;border-bottom:1px solid rgba(39,39,42,.55)}tr:hover td{background:rgba(39,39,42,.35)}tr.row-selected td{background:rgba(16,185,129,.28)!important;box-shadow:inset 3px 0 0 #34d399}tbody tr{cursor:pointer}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tr{text-align:right}.tc{text-align:center}.tl{text-align:left}.em{color:var(--emerald)}.ro{color:var(--rose)}.pos{color:var(--emerald)}.neg{color:var(--rose)}.mu{color:var(--muted)}
footer{text-align:center;padding:24px 0 16px;font-size:.7rem;color:#52525b}footer a{color:var(--muted)}.note{font-size:.75rem;color:var(--muted);margin:8px 0 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:#111113;font-size:.78rem}
.controls label{color:var(--muted);margin-right:4px}.controls select,.controls input{background:#1c1c1f;color:var(--text);border:1px solid #333;border-radius:5px;padding:5px 8px;font-size:.78rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center}.modal-overlay.open{display:flex}
.modal{background:#18181b;border:1px solid #333;border-radius:12px;width:min(420px,92vw);max-height:90vh;overflow:auto;padding:20px}
.modal h3{font-size:1rem;margin-bottom:16px}.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #27272a;font-size:.85rem}
.modal-row label{color:var(--muted)}.modal-row input,.modal-row select{background:#1c1c1f;color:var(--text);border:1px solid #333;border-radius:5px;padding:5px 8px;font-size:.8rem}
.modal-actions{margin-top:18px;display:flex;gap:8px;justify-content:flex-end}.btn-primary{background:#059669;color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer}.btn-secondary{background:#27272a;color:var(--muted);border:none;border-radius:6px;padding:7px 14px;cursor:pointer}
.levels-card{display:grid;grid-template-columns:1fr;margin-bottom:16px}.lvl-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:.85rem;font-family:ui-monospace,monospace}.lvl-strike{font-weight:600}.lvl-meta{font-size:.75rem;color:var(--muted)}
.day-change{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:.82rem}.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}.dc-item{padding:3px 0;font-family:ui-monospace,monospace;font-size:.8rem}.dc-up{color:var(--emerald)}.dc-down{color:var(--rose)}.dc-new{color:#fbbf24}.dc-label{color:var(--muted);font-size:.72rem;margin-bottom:2px}
.tab-bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0;width:100%;margin:0 auto;border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab-btn.active{color:var(--emerald);border-bottom-color:var(--emerald);font-weight:500}
.tab-panels{width:100%;max-width:100%;margin:0 auto;padding:12px 16px 24px;min-height:calc(100vh - 140px);box-sizing:border-box}.tab-panel{display:none}.tab-panel.active{display:block}
.futures-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 4px}.fut-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}.fut-card h3{font-size:.8rem;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
.fut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.fut-item .fl{font-size:.68rem;color:var(--muted)}.fut-item .fv{font-size:.95rem;font-weight:600;font-family:ui-monospace,monospace}.fut-item .fs{font-size:.72rem}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.cmp-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}.cmp-card h3{font-size:.85rem;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between}.cmp-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #1f1f23;font-size:.8rem}.cmp-label{color:var(--muted);font-size:.72rem;margin-bottom:4px}.cmp-metric{font-family:ui-monospace,monospace;font-weight:600}
.brand-lockup{display:flex;align-items:center;gap:12px}.brand-logo-link img{height:40px;width:auto;border-radius:6px;object-fit:cover;display:block}
.header-menu{position:relative;display:inline-flex}.menu-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer}.menu-toggle svg{width:18px;height:18px}.menu-dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:168px;padding:6px;border-radius:10px;background:#18181b;border:1px solid #27272a;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:50}.header-menu.open .menu-dropdown{display:block}
.menu-dropdown a,.menu-dropdown button{display:flex;width:100%;padding:9px 12px;border:none;border-radius:7px;background:transparent;color:var(--text);font-size:.82rem;text-decoration:none;cursor:pointer;text-align:left;box-sizing:border-box}.menu-dropdown a:hover,.menu-dropdown button:hover{background:#27272a}.menu-dropdown a.menu-active,.menu-dropdown button.menu-active{color:#34d399;background:rgba(52,211,153,.1)}
.menu-section{font-size:.68rem;color:#71717a;padding:6px 12px 4px}.menu-divider{height:1px;background:#27272a;margin:6px 4px}
@media(max-width:768px){header .inner{flex-direction:column;align-items:flex-start;gap:10px;padding:0 10px}h1{font-size:1rem}.grid-summary{grid-template-columns:1fr 1fr}.brand-logo-link img{height:32px}table{font-size:.75rem}.dc-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand-lockup"><a href="../" class="brand-logo-link" title="回到首頁"><img src="../exodus-logo.jpg" alt="Exodus Trading Group" /></a><div class="brand-text"><h1>恒指期權未平倉 <span>HSI Options OI</span></h1></div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="date-picker"><label for="dateSelect">日期</label><select id="dateSelect" onchange="onDateSelectChange()"></select></div>
      <div class="atm-header" id="globalFilters" title="近價過濾">
        <label class="gf-item"><input type="checkbox" id="atmEnabledGlobal" onchange="onAtmToggle()" /> 近價</label>
        <select id="atmRangeGlobal" onchange="onAtmToggle()">
          <option value="400">±400</option><option value="600">±600</option><option value="800" selected>±800</option>
          <option value="1000">±1000</option><option value="1200">±1200</option><option value="1600">±1600</option><option value="2000">±2000</option>
        </select>
        <span class="tag" id="atmCenterLabel">—</span>
      </div>
      <div class="header-menu" id="headerMenu">
        <button type="button" class="menu-toggle" onclick="toggleHeaderMenu(event)" title="選單" aria-label="選單">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="menu-dropdown">
          <div class="menu-section">產品</div>
          <button type="button" id="menuProdHsi" onclick="closeHeaderMenu();switchProduct('hsi')">恒指期權 HSI</button>
          <button type="button" id="menuProdMini" onclick="closeHeaderMenu();switchProduct('mini')">小型恒指期權 Mini-HSI</button>
          <div class="menu-divider"></div>
          <div class="menu-section">頁面</div>
          <a href="../">總覽 Home</a>
          <a href="./" class="menu-active">恒指期權 HSI OI</a>
          <a href="../stock-oi/">股票期權 Stocks</a>
          <a href="../futures/">期貨 Futures</a>
          <a href="../analysis/">交易表現 Analysis</a>
          <a href="../checklist/">開市清單 Checklist</a>
          <a href="../daily/">每日清單 Daily</a>
          <div class="menu-divider"></div>
          <button type="button" onclick="closeHeaderMenu();window.print()">列印</button>
          <button type="button" onclick="closeHeaderMenu();openSettings()">設定</button>
        </div>
      </div>
    </div>
  </div>
</header>
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>設定 Settings</h3>
    <div class="modal-row"><label>預設最低 OI</label><input type="number" id="setMinOI" min="0" step="50" /></div>
    <div class="modal-row"><label>預設最低成交量</label><input type="number" id="setMinVol" min="0" step="10" /></div>
    <div class="modal-row"><label>預設排序</label><select id="setSortKey"><option value="strike">行使價</option><option value="totalOI">總 OI</option><option value="callOI">Call OI</option><option value="putOI">Put OI</option></select></div>
    <div class="modal-row"><label>排序方向</label><select id="setSortDir"><option value="desc">高 → 低</option><option value="asc">低 → 高</option></select></div>
    <div class="modal-row"><label>隱藏空白行使價</label><input type="checkbox" id="setOnlyActive" /></div>
    <div class="modal-row"><label>字體大小</label><select id="setFontScale"><option value="85">小 (85%)</option><option value="100">標準 (100%)</option><option value="115">中 (115%)</option><option value="130">大 (130%)</option></select></div>
    <div class="modal-row"><label>只看近價</label><input type="checkbox" id="setAtmEnabled" /></div>
    <div class="modal-row"><label>近價範圍 ± 點數</label><input type="number" id="setAtmRange" min="200" max="3000" step="100" /></div>
    <div class="modal-row"><label>高亮 Top N</label><input type="number" id="setTopN" min="1" max="20" step="1" /></div>
    <div class="modal-actions"><button class="btn-secondary" onclick="resetSettings()">重設</button><button class="btn-secondary" onclick="closeSettings()">取消</button><button class="btn-primary" onclick="saveSettings()">儲存</button></div>
  </div>
</div>
<div class="container">
  <div class="note" id="status" style="width:100%;margin:8px auto 0;padding:0 16px;">載入中…</div>
  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">總覽</button>
    <button class="tab-btn" data-tab="walls" onclick="switchTab('walls')">重貨區</button>
    <button class="tab-btn" data-tab="strikes" onclick="switchTab('strikes')">行使價分佈</button>
    <button class="tab-btn" data-tab="topvol" onclick="switchTab('topvol')">十大成交</button>
    <button class="tab-btn" data-tab="compare" onclick="switchTab('compare')">對比 HSI vs Mini</button>
  </div>
  <div class="tab-panels">
    <div class="tab-panel active" id="tab-overview"><div id="futuresBar"></div><div id="summary" class="grid-summary"></div><div id="levelsCard" class="levels-card"></div><div id="dayChange"></div></div>
    <div class="tab-panel" id="tab-walls"><div id="zones" class="zones"></div></div>
    <div class="tab-panel" id="tab-strikes"><div id="strikes"></div></div>
    <div class="tab-panel" id="tab-topvol"><div id="topVolume"></div></div>
    <div class="tab-panel" id="tab-compare">
      <div class="filters" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;font-size:.78rem;">
        <label style="color:var(--muted);">最低 OI <input type="number" id="cmpMinOI" value="100" min="0" step="50" style="width:90px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;" oninput="renderCompare(currentDate)" /></label>
        <label style="color:var(--muted);">Top N <select id="cmpTopN" onchange="renderCompare(currentDate)" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;"><option value="3">3</option><option value="5" selected>5</option><option value="8">8</option><option value="10">10</option></select></label>
      </div>
      <div id="compareBox"></div>
    </div>
  </div>
  <footer>
    <p>Exodus Trading Group · 數據僅供參考 · 不構成投資建議</p>
    <p style="margin-top:6px">Source: <a id="sourceLink" href="#" target="_blank" rel="noopener">HKEX Daily Market Report</a></p>
    <p style="margin-top:4px">每日 22:50 HKT 自動更新（GitHub Actions）</p>
  </footer>
</div>
<script src="../data.js"></script>
<script src="../data-mini.js"></script>
<script src="app.js"></script>
<script src="../tab-order.js"></script>
</body>
</html>
