<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恒指期權未平倉 | HSI Options OI</title>
  <style>
    :root {
      --bg: #09090b; --card: #18181b; --border: #27272a; --text: #fafafa;
      --muted: #a1a1aa; --emerald: #34d399; --rose: #fb7185;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header {
      border-bottom: 1px solid var(--border); background: rgba(24,24,27,0.92);
      backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20; padding: 12px 0;
    }
    header .inner {
      max-width: 1100px; margin: 0 auto; padding: 0 16px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    h1 { font-size: 1.15rem; font-weight: 600; }
    h1 span { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .date-btns { display: flex; gap: 6px; flex-wrap: wrap; max-width: 420px; justify-content: flex-end; }
    .date-btn {
      font-size: 0.72rem; padding: 5px 9px; border-radius: 6px;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; font-family: ui-monospace, monospace;
    }
    .date-btn.active { background: #059669; color: #fff; border-color: #059669; }
    .date-btn:hover:not(.active) { background: #27272a; }
    .grid-summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin: 20px 0;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
    }
    .card .label { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .card .value { font-size: 1.15rem; font-weight: 600; }
    .card .subv { font-size: 0.75rem; margin-top: 2px; }
    .section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 16px; overflow: hidden;
    }
    .section-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .section-header h2 { font-size: 0.9rem; font-weight: 500; }
    .section-header .tag { font-size: 0.7rem; color: var(--muted); }
    .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 700px) { .zones { grid-template-columns: 1fr; } }
    @media (min-width: 900px) { .zones { grid-template-columns: 1fr 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: left; padding: 8px 12px; font-size: 0.7rem; color: var(--muted);
      font-weight: 500; border-bottom: 1px solid var(--border); background: var(--card);
      position: sticky; top: 0;
    }
    td { padding: 6px 12px; border-bottom: 1px solid rgba(39,39,42,0.55); }
    tr:hover td { background: rgba(39,39,42,0.35); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tr { text-align: right; } .tc { text-align: center; } .tl { text-align: left; }
    .em { color: var(--emerald); } .ro { color: var(--rose); }
    .pos { color: var(--emerald); } .neg { color: var(--rose); } .mu { color: var(--muted); }
    .bar-cell { position: relative; }
    .bar { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; opacity: 0.22; }
    .bar-c { right: 0; background: var(--emerald); }
    .bar-p { left: 0; background: var(--rose); }
    .bar-cell span { position: relative; z-index: 1; }
    .table-wrap { max-height: 420px; overflow: auto; }
    .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: #18181b; }
    .table-wrap::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    footer { text-align: center; padding: 24px 0 16px; font-size: 0.7rem; color: #52525b; }
    footer a { color: var(--muted); } footer a:hover { color: var(--emerald); }
    .note { font-size: 0.75rem; color: var(--muted); margin: 8px 0 16px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: #111113; font-size: 0.78rem;
    }
    .controls label { color: var(--muted); margin-right: 4px; }
    .controls select, .controls input {
      background: #1c1c1f; color: var(--text); border: 1px solid #333;
      border-radius: 5px; padding: 5px 8px; font-size: 0.78rem;
    }
    .controls input[type="number"] { width: 70px; }
    .controls input[type="checkbox"] { accent-color: #34d399; }

    /* Clean highlights: left accent bar + very light bg */
    tr.hl-oi td { background: rgba(52, 211, 153, 0.05); }
    tr.hl-oi td:first-child { box-shadow: inset 3px 0 0 #34d399; }
    tr.hl-vol td { background: rgba(251, 191, 36, 0.04); }
    tr.hl-vol td:first-child { box-shadow: inset 3px 0 0 #fbbf24; }
    tr.hl-chg td { background: rgba(96, 165, 250, 0.04); }
    tr.hl-chg td:first-child { box-shadow: inset 3px 0 0 #60a5fa; }
    tr.hl-both td { background: rgba(52, 211, 153, 0.08); }
    tr.hl-both td:first-child { box-shadow: inset 3px 0 0 #34d399; }

    .badge {
      display: inline-block; font-size: 0.6rem; padding: 0 4px;
      border-radius: 3px; margin-left: 3px; vertical-align: middle;
      font-weight: 600; line-height: 1.35;
    }
    .badge-oi { background: transparent; color: #34d399; border: 1px solid rgba(52,211,153,0.5); }
    .badge-vol { background: transparent; color: #fbbf24; border: 1px solid rgba(251,191,36,0.5); }
    .badge-chg { background: transparent; color: #60a5fa; border: 1px solid rgba(96,165,250,0.5); }

    .legend {
      font-size: 0.7rem; color: var(--muted); padding: 6px 14px;
      border-bottom: 1px solid var(--border);
    }
    .legend span { margin-right: 14px; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <div>
        <h1>恒指期權未平倉 <span>HSI Options OI</span></h1>
        <div class="sub">港交所每日市場報告 · 重貨區 / 未平倉分佈 · 配合日內交易</div>
      </div>
      <div class="date-btns" id="dateButtons"></div>
    </div>
  </header>

  <div class="container">
    <div class="note" id="status">載入中…</div>
    <div id="summary" class="grid-summary"></div>
    <div id="zones" class="zones"></div>
    <div id="strikes"></div>
    <div id="topVolume"></div>
    <footer>
      <p>個人交易工具 · 數據僅供參考 · 不構成投資建議</p>
      <p style="margin-top:6px">Source: <a id="sourceLink" href="#" target="_blank" rel="noopener">HKEX Daily Market Report</a></p>
      <p style="margin-top:4px">每日 22:50 HKT 自動更新（GitHub Actions）</p>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    const reports = window.HSI_REPORTS || {};
    const availableDates = Object.keys(reports).sort().reverse();
    let currentDate = availableDates[0] || null;
    let currentReport = null;

    // Filter / sort state
    let sortKey = "strike";
    let sortDir = "desc";
    let minOI = 0;
    let minVol = 0;
    let onlyActive = true; // hide zero OI and zero vol

    function fmt(n) { return (n || 0).toLocaleString("en-US"); }
    function fmtChg(n) {
      if (n > 0) return "+" + n.toLocaleString("en-US");
      return (n || 0).toLocaleString("en-US");
    }
    function chgClass(n) {
      if (n > 0) return "pos";
      if (n < 0) return "neg";
      return "mu";
    }

    function getImportantSets(strikes) {
      const byCallOI = [...strikes].sort((a,b) => (b.callOI||0)-(a.callOI||0)).slice(0,5).map(s=>s.strike);
      const byPutOI  = [...strikes].sort((a,b) => (b.putOI||0)-(a.putOI||0)).slice(0,5).map(s=>s.strike);
      const byCallVol= [...strikes].sort((a,b) => (b.callVol||0)-(a.callVol||0)).slice(0,5).map(s=>s.strike);
      const byPutVol = [...strikes].sort((a,b) => (b.putVol||0)-(a.putVol||0)).slice(0,5).map(s=>s.strike);
      const byChg = [...strikes].sort((a,b) =>
        Math.max(Math.abs(b.callChange||0), Math.abs(b.putChange||0)) -
        Math.max(Math.abs(a.callChange||0), Math.abs(a.putChange||0))
      ).slice(0,5).map(s=>s.strike);

      return {
        oi: new Set([...byCallOI, ...byPutOI]),
        vol: new Set([...byCallVol, ...byPutVol]),
        chg: new Set(byChg),
      };
    }

    function renderStrikeTable() {
      if (!currentReport) return;
      const r = currentReport;
      let rows = [...(r.strikes || [])];

      // Filter
      rows = rows.filter(s => {
        const oi = (s.callOI||0) + (s.putOI||0);
        const vol = (s.callVol||0) + (s.putVol||0);
        if (onlyActive && oi === 0 && vol === 0) return false;
        if (oi < minOI) return false;
        if (vol < minVol) return false;
        return true;
      });

      // Sort
      rows.sort((a, b) => {
        let va, vb;
        switch (sortKey) {
          case "callOI": va = a.callOI||0; vb = b.callOI||0; break;
          case "putOI":  va = a.putOI||0;  vb = b.putOI||0;  break;
          case "callVol":va = a.callVol||0;vb = b.callVol||0;break;
          case "putVol": va = a.putVol||0; vb = b.putVol||0; break;
          case "totalOI":va = (a.callOI||0)+(a.putOI||0); vb = (b.callOI||0)+(b.putOI||0); break;
          case "chg":    va = Math.max(Math.abs(a.callChange||0), Math.abs(a.putChange||0));
                         vb = Math.max(Math.abs(b.callChange||0), Math.abs(b.putChange||0)); break;
          default:       va = a.strike; vb = b.strike;
        }
        return sortDir === "desc" ? vb - va : va - vb;
      });

      const important = getImportantSets(r.strikes || []);
      const maxOI = Math.max(1, ...rows.map(x => Math.max(x.callOI||0, x.putOI||0)));

      document.getElementById("strikes").innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2>即月行使價分佈</h2>
            <span class="tag">顯示 ${rows.length} / ${(r.strikes||[]).length} strikes</span>
          </div>
          <div class="controls">
            <div>
              <label>排序</label>
              <select id="sortKey" onchange="onFilterChange()">
                <option value="strike" ${sortKey==="strike"?"selected":""}>行使價</option>
                <option value="totalOI" ${sortKey==="totalOI"?"selected":""}>總 OI</option>
                <option value="callOI" ${sortKey==="callOI"?"selected":""}>Call OI</option>
                <option value="putOI" ${sortKey==="putOI"?"selected":""}>Put OI</option>
                <option value="callVol" ${sortKey==="callVol"?"selected":""}>Call Vol</option>
                <option value="putVol" ${sortKey==="putVol"?"selected":""}>Put Vol</option>
                <option value="chg" ${sortKey==="chg"?"selected":""}>最大變化</option>
              </select>
              <select id="sortDir" onchange="onFilterChange()">
                <option value="desc" ${sortDir==="desc"?"selected":""}>高→低</option>
                <option value="asc" ${sortDir==="asc"?"selected":""}>低→高</option>
              </select>
            </div>
            <div>
              <label>最低 OI</label>
              <input type="number" id="minOI" value="${minOI}" min="0" step="50" onchange="onFilterChange()" />
            </div>
            <div>
              <label>最低成交量</label>
              <input type="number" id="minVol" value="${minVol}" min="0" step="10" onchange="onFilterChange()" />
            </div>
            <div>
              <label>
                <input type="checkbox" id="onlyActive" ${onlyActive?"checked":""} onchange="onFilterChange()" />
                隱藏空白
              </label>
            </div>
          </div>
          <div class="legend">
            <span><span class="badge badge-oi">OI</span> 高未平倉</span>
            <span><span class="badge badge-vol">Vol</span> 高成交量</span>
            <span><span class="badge badge-chg">Δ</span> 大變化</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="tr">Call Vol</th><th class="tr">Call OI</th><th class="tr">Δ</th>
                  <th class="tc">行使價</th>
                  <th class="tl">Δ</th><th class="tl">Put OI</th><th class="tl">Put Vol</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => {
                  const isOI = important.oi.has(row.strike);
                  const isVol = important.vol.has(row.strike);
                  const isChg = important.chg.has(row.strike);
                  let cls = "";
                  if (isOI && isVol) cls = "hl-both";
                  else if (isOI) cls = "hl-oi";
                  else if (isVol) cls = "hl-vol";
                  else if (isChg) cls = "hl-chg";

                  let badges = "";
                  if (isOI) badges += '<span class="badge badge-oi">OI</span>';
                  if (isVol) badges += '<span class="badge badge-vol">Vol</span>';
                  if (isChg) badges += '<span class="badge badge-chg">Δ</span>';

                  const cw = Math.round(((row.callOI||0) / maxOI) * 88);
                  const pw = Math.round(((row.putOI||0) / maxOI) * 88);
                  return `<tr class="${cls}">
                    <td class="tr mono mu" style="font-size:0.75rem">${fmt(row.callVol||0)}</td>
                    <td class="tr mono bar-cell"><div class="bar bar-c" style="width:${cw}%"></div><span>${fmt(row.callOI||0)}</span></td>
                    <td class="tr mono ${chgClass(row.callChange)}" style="font-size:0.75rem">${fmtChg(row.callChange)}</td>
                    <td class="tc mono" style="font-weight:500">${row.strike}${badges}</td>
                    <td class="tl mono ${chgClass(row.putChange)}" style="font-size:0.75rem">${fmtChg(row.putChange)}</td>
                    <td class="tl mono bar-cell"><div class="bar bar-p" style="width:${pw}%"></div><span>${fmt(row.putOI||0)}</span></td>
                    <td class="tl mono mu" style="font-size:0.75rem">${fmt(row.putVol||0)}</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function onFilterChange() {
      const sk = document.getElementById("sortKey");
      const sd = document.getElementById("sortDir");
      const moi = document.getElementById("minOI");
      const mv = document.getElementById("minVol");
      const oa = document.getElementById("onlyActive");
      if (sk) sortKey = sk.value;
      if (sd) sortDir = sd.value;
      if (moi) minOI = parseInt(moi.value, 10) || 0;
      if (mv) minVol = parseInt(mv.value, 10) || 0;
      if (oa) onlyActive = oa.checked;
      renderStrikeTable();
    }

    function render(date) {
      const r = reports[date];
      if (!r) {
        document.getElementById("status").textContent = "沒有資料。請先執行更新。";
        return;
      }
      currentDate = date;
      currentReport = r;

      document.getElementById("status").textContent =
        `顯示 ${r.date} · 共 ${availableDates.length} 個交易日 · 即月行使價 ${(r.strikes||[]).length} 個`;

      document.getElementById("dateButtons").innerHTML = availableDates.map(d =>
        `<button class="date-btn ${d === date ? "active" : ""}" onclick="render('${d}')">${d}</button>`
      ).join("");

      const s = r.summary;
      document.getElementById("summary").innerHTML = `
        <div class="card"><div class="label">交易日</div><div class="value">${r.date}</div><div class="subv">前一日 ${r.prevDate}</div></div>
        <div class="card"><div class="label">即月</div><div class="value">${s.frontMonth}</div></div>
        <div class="card"><div class="label">Call OI</div><div class="value">${fmt(s.callOI)}</div><div class="subv ${chgClass(s.callOIChange)}">${fmtChg(s.callOIChange)}</div></div>
        <div class="card"><div class="label">Put OI</div><div class="value">${fmt(s.putOI)}</div><div class="subv ${chgClass(s.putOIChange)}">${fmtChg(s.putOIChange)}</div></div>
        <div class="card"><div class="label">街貨比例</div><div class="value">${s.callPct}% / ${s.putPct}%</div><div class="subv">Call / Put</div></div>
        <div class="card"><div class="label">總 OI</div><div class="value">${fmt(s.totalOI)}</div><div class="subv ${chgClass(s.totalOIChange)}">${fmtChg(s.totalOIChange)}</div></div>
      `;

      const hz = r.heavyZones || {};
      if (!(hz.callVolWalls && hz.callVolWalls.length) && r.strikes) {
        hz.callVolWalls = [...r.strikes]
          .filter(s => (s.callVol || 0) > 0)
          .sort((a,b) => (b.callVol||0) - (a.callVol||0))
          .slice(0,6)
          .map(s => ({strike: s.strike, volume: s.callVol}));
      }
      if (!(hz.putVolWalls && hz.putVolWalls.length) && r.strikes) {
        hz.putVolWalls = [...r.strikes]
          .filter(s => (s.putVol || 0) > 0)
          .sort((a,b) => (b.putVol||0) - (a.putVol||0))
          .slice(0,6)
          .map(s => ({strike: s.strike, volume: s.putVol}));
      }

      document.getElementById("zones").innerHTML = `
        <div class="section">
          <div class="section-header"><h2>Call 重貨區 (潛在阻力)</h2><span class="tag em">OI Walls</span></div>
          <table>
            <thead><tr><th>行使價</th><th class="tr">未平倉</th><th class="tr">變化</th></tr></thead>
            <tbody>
              ${(hz.callWalls || []).map(z => `
                <tr>
                  <td class="mono em">${z.strike}</td>
                  <td class="tr mono">${fmt(z.oi)}</td>
                  <td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-header"><h2>Put 重貨區 (潛在支持)</h2><span class="tag ro">OI Walls</span></div>
          <table>
            <thead><tr><th>行使價</th><th class="tr">未平倉</th><th class="tr">變化</th></tr></thead>
            <tbody>
              ${(hz.putWalls || []).map(z => `
                <tr>
                  <td class="mono ro">${z.strike}</td>
                  <td class="tr mono">${fmt(z.oi)}</td>
                  <td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-header"><h2>Call 成交量重區</h2><span class="tag em">Volume</span></div>
          <table>
            <thead><tr><th>行使價</th><th class="tr">成交量</th></tr></thead>
            <tbody>
              ${(hz.callVolWalls || []).map(z => `
                <tr>
                  <td class="mono em">${z.strike}</td>
                  <td class="tr mono">${fmt(z.volume)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-header"><h2>Put 成交量重區</h2><span class="tag ro">Volume</span></div>
          <table>
            <thead><tr><th>行使價</th><th class="tr">成交量</th></tr></thead>
            <tbody>
              ${(hz.putVolWalls || []).map(z => `
                <tr>
                  <td class="mono ro">${z.strike}</td>
                  <td class="tr mono">${fmt(z.volume)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;

      renderStrikeTable();

      document.getElementById("topVolume").innerHTML = `
        <div class="section">
          <div class="section-header"><h2>十大成交 (按成交量)</h2><span class="tag">Top 10 by Volume</span></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>月份</th><th>行使價</th><th>類型</th>
                  <th class="tr">成交量</th><th class="tr">結算價</th>
                  <th class="tr">IV%</th><th class="tr">OI</th><th class="tr">OI變化</th>
                </tr>
              </thead>
              <tbody>
                ${(r.topVolume || []).map(item => `
                  <tr>
                    <td class="mono mu" style="font-size:0.75rem">${item.month}</td>
                    <td class="mono">${item.strike}</td>
                    <td class="${item.type === "Call" ? "em" : "ro"}">${item.type === "Call" ? "認購" : "認沽"}</td>
                    <td class="tr mono">${fmt(item.volume)}</td>
                    <td class="tr mono">${item.settle}</td>
                    <td class="tr mono mu">${item.iv}</td>
                    <td class="tr mono">${fmt(item.oi)}</td>
                    <td class="tr mono ${chgClass(item.oiChange)}">${fmtChg(item.oiChange)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById("sourceLink").href = r.sourceUrl || "#";
    }

    if (availableDates.length) {
      render(availableDates[0]);
    } else {
      document.getElementById("status").textContent =
        "尚未有數據。請執行 GitHub Actions 更新。";
    }
  </script>
</body>
</html>
