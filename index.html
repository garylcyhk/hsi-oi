<!DOCTYPE html>
<html lang="zh-HK">
<head>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>總覽 · Exodus Trading Group</title>
<style>
:root {
  --bg: #09090b; --card: #18181b; --border: #27272a;
  --text: #e4e4e7; --muted: #a1a1aa;
  --emerald: #34d399; --rose: #fb7185; --amber: #fbbf24;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}
header {
  border-bottom: 1px solid var(--border); background: rgba(24,24,27,.92);
  position: sticky; top: 0; z-index: 20; padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
}
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-logo-link { display: block; line-height: 0; }
.brand-logo-link img { height: 40px; width: auto; border-radius: 6px; object-fit: cover; display: block; }
h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
h1 span { color: var(--muted); font-weight: 400; font-size: .85rem; }
.header-menu { position: relative; display: inline-flex; }
.menu-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer;
}
.menu-toggle:hover { border-color: #3f3f46; }
.menu-toggle svg { width: 18px; height: 18px; }
.menu-dropdown {
  display: none; position: absolute; right: 0; top: calc(100% + 6px);
  min-width: 180px; padding: 6px; border-radius: 10px;
  background: #18181b; border: 1px solid #27272a;
  box-shadow: 0 12px 32px rgba(0,0,0,.45); z-index: 50;
}
.header-menu.open .menu-dropdown { display: block; }
.menu-dropdown a, .menu-dropdown button {
  display: flex; width: 100%; padding: 9px 12px; border: none; border-radius: 7px;
  background: transparent; color: var(--text); font-size: .82rem; text-decoration: none;
  cursor: pointer; text-align: left; box-sizing: border-box;
}
.menu-dropdown a:hover, .menu-dropdown button:hover { background: #27272a; }
.menu-dropdown a.menu-active { color: var(--emerald); background: rgba(52,211,153,.1); }
.menu-section { font-size: .68rem; color: #71717a; padding: 6px 12px 4px; }
.menu-divider { height: 1px; background: #27272a; margin: 6px 4px; }
.container { width: 100%; max-width: 100%; padding: 16px; }
.note { color: var(--muted); font-size: .78rem; margin-bottom: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s;
  text-decoration: none; color: inherit; display: block;
}
.card:hover { border-color: #3f3f46; transform: translateY(-1px); }
.card h2 {
  margin: 0 0 10px; font-size: .8rem; font-weight: 500; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
.card h2 .go { color: var(--emerald); font-size: .72rem; }
.bias {
  font-size: 1.15rem; font-weight: 600; margin-bottom: 6px;
}
.bias.res { color: var(--rose); }
.bias.sup { color: var(--emerald); }
.bias.mid { color: var(--amber); }
.bias.far, .bias.na { color: var(--muted); }
.meta { font-size: .78rem; color: var(--muted); line-height: 1.5; font-family: ui-monospace, monospace; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: .8rem; }
.row .k { color: var(--muted); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem;
  background: rgba(161,161,170,.12); color: var(--muted);
}
.tag.res { background: rgba(244,63,94,.15); color: var(--rose); }
.tag.sup { background: rgba(52,211,153,.15); color: var(--emerald); }
.tag.mid { background: rgba(251,191,36,.12); color: var(--amber); }
.stocks { margin-top: 8px; }
.stocks table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.stocks th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; font-size: .68rem; }
.stocks td { padding: 5px 6px; border-top: 1px solid #1f1f23; font-family: ui-monospace, monospace; }
.stocks .tr { text-align: right; }
footer {
  margin-top: 28px; padding: 16px; text-align: center; color: #52525b; font-size: .75rem;
}
footer a { color: var(--muted); }
@media (max-width: 768px) {
  .brand-logo-link img { height: 32px; }
  h1 { font-size: .95rem; }
}
</style>
</head>
<body>
<header>
  <div class="brand-lockup">
    <a href="./" class="brand-logo-link" title="總覽">
      <img src="exodus-logo.jpg" alt="Exodus Trading Group" />
    </a>
    <h1>總覽 <span>Exodus Trading Group</span></h1>
  </div>
  <div class="header-menu" id="headerMenu">
    <button type="button" class="menu-toggle" onclick="toggleHeaderMenu(event)" title="選單" aria-label="選單">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <div class="menu-dropdown">
      <div class="menu-section">頁面</div>
      <a href="./" class="menu-active">總覽 Home</a>
      <a href="./options/">恒指期權 HSI OI</a>
      <a href="./stock-oi/">股票期權 Stocks</a>
      <a href="./futures/">期貨 Futures</a>
    </div>
  </div>
</header>

<div class="container">
  <div class="note" id="status">載入中…</div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  <p>Exodus Trading Group · 數據僅供參考 · 不構成投資建議</p>
  <p style="margin-top:6px">Source: HKEX Daily Market Report</p>
</footer>

<script src="data.js"></script>
<script src="data-mini.js"></script>
<script src="stock-oi/data.js"></script>
<script>
function toggleHeaderMenu(e){
  if(e) e.stopPropagation();
  document.getElementById("headerMenu").classList.toggle("open");
}
document.addEventListener("click", function(e){
  const m = document.getElementById("headerMenu");
  if(m && !m.contains(e.target)) m.classList.remove("open");
});

const fmt = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");
const STOCK_ORDER = ["TCH","ALB","MIU","MET","HEX"];

function latestKey(bag){
  const keys = Object.keys(bag||{}).sort().reverse();
  return keys[0] || null;
}
function settleOf(r){
  if(!r) return null;
  return r.futures?.hsif?.front?.settle || r.futures?.mhif?.front?.settle || null;
}
function biasFromWalls(close, callWalls, putWalls){
  if(close==null || close===0) return { label:"—", cls:"na", note:"" };
  const calls = (callWalls||[]).slice();
  const puts = (putWalls||[]).slice();
  const nearCall = calls.filter(z=>z.strike>=close).sort((a,b)=>a.strike-b.strike)[0]
    || calls.slice().sort((a,b)=>Math.abs(a.strike-close)-Math.abs(b.strike-close))[0];
  const nearPut = puts.filter(z=>z.strike<=close).sort((a,b)=>b.strike-a.strike)[0]
    || puts.slice().sort((a,b)=>Math.abs(a.strike-close)-Math.abs(b.strike-close))[0];
  const distCall = nearCall ? nearCall.strike - close : null;
  const distPut = nearPut ? close - nearPut.strike : null;
  const band = Math.max(Math.abs(close)*0.01, close > 1000 ? 150 : close*0.015);
  const callNear = distCall!=null && distCall>=0 && distCall<=band*1.2;
  const putNear = distPut!=null && distPut>=0 && distPut<=band*1.2;
  const callAbove = nearCall && nearCall.strike >= close;
  const putBelow = nearPut && nearPut.strike <= close;
  let label="牆遠", cls="far";
  if(callNear && putNear && callAbove && putBelow){ label="夾在牆中"; cls="mid"; }
  else if(callNear && callAbove){ label="潛在阻力"; cls="res"; }
  else if(putNear && putBelow){ label="潛在支持"; cls="sup"; }
  else if(distCall!=null && distPut!=null){
    if(Math.abs(distCall)<Math.abs(distPut) && callAbove){ label="偏近阻力"; cls="res"; }
    else if(Math.abs(distPut)<Math.abs(distCall) && putBelow){ label="偏近支持"; cls="sup"; }
  }
  const note = [
    nearCall ? `Call ${nearCall.strike} (${distCall>=0?"+":""}${Math.round(distCall)})` : null,
    nearPut ? `Put ${nearPut.strike} (${distPut>=0?"+":""}${Math.round(distPut)})` : null,
  ].filter(Boolean).join(" · ");
  return { label, cls, note, nearCall, nearPut, distCall, distPut };
}

function hsiBias(r){
  if(!r) return { label:"無資料", cls:"na", note:"" };
  const settle = settleOf(r);
  const hz = r.heavyZones || {};
  return biasFromWalls(settle, hz.callWalls, hz.putWalls);
}

function stockBias(u){
  return biasFromWalls(u.close, u.callWalls, u.putWalls);
}

function futuresRegime(stockBag, hsiBag){
  // Prefer multi-day from STOCK_OI
  const bag = stockBag || {};
  const keys = Object.keys(bag).sort().reverse().slice(0, 15);
  if(keys.length < 2) return { label:"—", cls:"na", note:"數據不足" };
  let up=0, down=0;
  const regimes = { "新多":0, "新空":0, "回補":0, "平多":0, "其他":0 };
  for(let i=0;i<keys.length-1;i++){
    const a = bag[keys[i]]?.futures?.hsif?.front;
    const b = bag[keys[i+1]]?.futures?.hsif?.front;
    if(!a||!b||a.settle==null||b.settle==null) continue;
    const dp = a.settle - b.settle;
    const doi = (a.oi||0) - (b.oi||0);
    if(dp>0) up++; else if(dp<0) down++;
    if(dp>0 && doi>0) regimes["新多"]++;
    else if(dp<0 && doi>0) regimes["新空"]++;
    else if(dp>0 && doi<0) regimes["回補"]++;
    else if(dp<0 && doi<0) regimes["平多"]++;
    else regimes["其他"]++;
  }
  const front = bag[keys[0]]?.futures?.hsif?.front;
  const topReg = Object.entries(regimes).sort((a,b)=>b[1]-a[1])[0];
  let cls = "far";
  if(topReg[0]==="新多"||topReg[0]==="回補") cls="sup";
  if(topReg[0]==="新空"||topReg[0]==="平多") cls="res";
  return {
    label: topReg[0],
    cls,
    note: `近${keys.length}日 漲${up} 跌${down} · Settle ${front?fmt(front.settle):"—"} · ΔOI ${front&&front.oiChange!=null?((front.oiChange>0?"+":"")+fmt(front.oiChange)):"—"}`
  };
}

function render(){
  const hsiBag = window.HSI_REPORTS || {};
  const miniBag = window.MINI_HSI_REPORTS || {};
  const stockBag = window.STOCK_OI || {};
  const dH = latestKey(hsiBag);
  const dM = latestKey(miniBag);
  const dS = latestKey(stockBag);
  const rH = dH ? hsiBag[dH] : null;
  const rM = dM ? miniBag[dM] : null;
  const rS = dS ? stockBag[dS] : null;

  document.getElementById("status").textContent =
    `最新數據 · HSI ${dH||"—"} · Mini ${dM||"—"} · Stocks/Futures ${dS||"—"}`;

  const bH = hsiBias(rH);
  const bM = hsiBias(rM);
  const settleH = settleOf(rH);
  const settleM = settleOf(rM);

  // consistency
  let cons = "—";
  if(bH.label!=="—" && bM.label!=="—" && bH.label!=="無資料"){
    cons = (bH.cls===bM.cls || bH.label===bM.label) ? "HSI↔Mini 一致" : "HSI↔Mini 分歧";
  }

  const fr = futuresRegime(stockBag, hsiBag);

  // stock rows
  let stockRows = "";
  if(rS && rS.underlyings){
    stockRows = STOCK_ORDER.map(h=>{
      const u = rS.underlyings[h];
      if(!u) return "";
      const b = stockBias(u);
      const code = String(u.code||"").replace(/^0+/,"")||u.code;
      return `<tr>
        <td>${code}</td>
        <td class="tr">${u.close!=null?u.close.toFixed(2):"—"}</td>
        <td><span class="tag ${b.cls}">${b.label}</span></td>
      </tr>`;
    }).join("");
  }

  document.getElementById("grid").innerHTML = `
    <a class="card" href="./options/">
      <h2><span>恒指期權 HSI</span><span class="go">詳情 →</span></h2>
      <div class="bias ${bH.cls}">${bH.label}</div>
      <div class="meta">${bH.note||"—"}</div>
      <div class="row"><span class="k">Settle</span><span>${settleH!=null?fmt(settleH):"—"}</span></div>
      <div class="row"><span class="k">日期</span><span>${dH||"—"}</span></div>
    </a>
    <a class="card" href="./options/">
      <h2><span>小型恒指 Mini-HSI</span><span class="go">詳情 →</span></h2>
      <div class="bias ${bM.cls}">${bM.label}</div>
      <div class="meta">${bM.note||"—"}</div>
      <div class="row"><span class="k">一致性</span><span>${cons}</span></div>
      <div class="row"><span class="k">日期</span><span>${dM||"—"}</span></div>
    </a>
    <a class="card" href="./stock-oi/">
      <h2><span>股票期權籃子</span><span class="go">詳情 →</span></h2>
      <div class="stocks">
        <table>
          <thead><tr><th>股票</th><th class="tr">收市</th><th>偏向</th></tr></thead>
          <tbody>${stockRows||'<tr><td colspan="3">無資料</td></tr>'}</tbody>
        </table>
      </div>
      <div class="row" style="margin-top:8px"><span class="k">日期</span><span>${dS||"—"}</span></div>
    </a>
    <a class="card" href="./futures/">
      <h2><span>期貨 HSI / MHI</span><span class="go">詳情 →</span></h2>
      <div class="bias ${fr.cls}">${fr.label}</div>
      <div class="meta">${fr.note}</div>
      <div class="row"><span class="k">日期</span><span>${dS||"—"}</span></div>
    </a>
  `;
}
render();
</script>
</body>
</html>
