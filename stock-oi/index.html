<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票期權未平倉 | Stock Options OI</title>
  <style>
    :root { --bg:#09090b; --card:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa; --emerald:#34d399; --rose:#fb7185; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header { border-bottom:1px solid var(--border); background:rgba(24,24,27,.92); position:sticky; top:0; z-index:20; padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; }
    h1 { font-size:1.1rem; font-weight:600; }
    h1 span { color:var(--muted); font-weight:400; font-size:.85rem; }
    .sub { font-size:.72rem; color:var(--muted); }
    .site-nav { display:flex; gap:6px; margin-top:6px; }
    .site-nav a { font-size:0.72rem; padding:3px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); text-decoration:none; }
    .site-nav a.active { background:#059669; color:#fff; border-color:#059669; }
    .site-nav a:hover:not(.active) { border-color:#555; color:var(--text); }
    select, input[type=date], input[type=number] {
      background:var(--card); color:var(--text); border:1px solid var(--border);
      border-radius:6px; padding:6px 10px; font-size:.8rem;
    }
    input[type=number] { width:80px; }
    .container { padding:12px 16px 32px; max-width:1200px; margin:0 auto; }
    .stock-tabs { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
    .stock-tab { background:var(--card); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.8rem; }
    .stock-tab.active { background:#059669; color:#fff; border-color:#059669; }
    .filters {
      display:flex; flex-wrap:wrap; gap:10px; align-items:center;
      padding:10px 12px; background:var(--card); border:1px solid var(--border);
      border-radius:8px; margin-bottom:12px; font-size:.78rem;
    }
    .filters label { color:var(--muted); display:flex; align-items:center; gap:6px; }
    .filters input[type=checkbox] { accent-color:#34d399; width:14px; height:14px; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:12px 0; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; }
    .card .label { font-size:.7rem; color:var(--muted); }
    .card .value { font-size:1.1rem; font-weight:600; font-family:ui-monospace,monospace; }
    .card .subv { font-size:.75rem; }
    .zones { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    @media (max-width:700px){ .zones{ grid-template-columns:1fr; } }
    .section { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; }
    .section-header { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .section-header h2 { font-size:.85rem; font-weight:500; }
    .tag { font-size:.7rem; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:.82rem; }
    th { text-align:left; padding:8px 12px; font-size:.7rem; color:var(--muted); border-bottom:1px solid var(--border); }
    td { padding:7px 12px; border-bottom:1px solid #1f1f23; }
    .tr { text-align:right; } .tc { text-align:center; }
    .mono { font-family:ui-monospace,monospace; }
    .em { color:var(--emerald); } .ro { color:var(--rose); }
    .pos { color:var(--emerald); } .neg { color:var(--rose); }
    .mu { color:var(--muted); }
    tbody tr { cursor:pointer; }
    tbody tr:hover td { background:rgba(39,39,42,.35); }
    tr.row-selected td { background:rgba(16,185,129,.28)!important; box-shadow:inset 3px 0 0 #34d399; }
    th.sortable { cursor:pointer; user-select:none; }
    th.sortable:hover { color:var(--text); }
    th.sortable.active { color:var(--emerald); }
    footer { text-align:center; padding:20px; font-size:.7rem; color:#52525b; }
    footer a { color:var(--muted); }
    .note { font-size:.75rem; color:var(--muted); margin-bottom:8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>股票期權未平倉 <span>Stock Options OI</span></h1>
      <div class="site-nav">
        <a href="../">恒指 HSI</a>
        <a class="active" href="./">股票期權 Stocks</a>
      </div>
      <div class="sub">港交所每日市場報告 · 700 / 9988 / 1810 / 3690 / 388</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <label class="mu" style="font-size:.75rem;">日期</label>
      <select id="dateSelect" onchange="render(this.value)"></select>
      <input type="date" id="dateCal" onchange="onCal()" />
    </div>
  </header>
  <div class="container">
    <div class="note" id="status">載入中…</div>
    <div class="stock-tabs" id="stockTabs"></div>
    <div id="summary" class="summary"></div>
    <div class="filters" id="filters">
      <label>最低 OI <input type="number" id="minOI" value="50" min="0" step="10" oninput="applyFilters()" /></label>
      <label>最低成交量 <input type="number" id="minVol" value="0" min="0" step="10" oninput="applyFilters()" /></label>
      <label>
        <input type="checkbox" id="nearMoney" onchange="applyFilters()" />
        近價
      </label>
      <select id="nearRange" onchange="applyFilters()">
        <option value="5">±5%</option>
        <option value="8" selected>±8%</option>
        <option value="10">±10%</option>
        <option value="15">±15%</option>
        <option value="20">±20%</option>
      </select>
      <span class="tag" id="centerLabel">中心: —</span>
    </div>
    <div id="zones" class="zones"></div>
    <div id="strikes"></div>
    <footer>
      <p>個人交易工具 · 數據僅供參考 · 不構成投資建議</p>
      <p style="margin-top:6px"><a id="src" href="#" target="_blank" rel="noopener">HKEX Stock Options Daily Report</a></p>
    </footer>
  </div>
  <script src="data.js"></script>
  <script>
    const reports = window.STOCK_OI || {};
    const dates = Object.keys(reports).sort().reverse();
    let curDate = dates[0] || null;
    let curHkats = null;

    // sort state per table
    const sortState = {
      callWall: { key: "oi", dir: "desc" },
      putWall: { key: "oi", dir: "desc" },
      callVol: { key: "volume", dir: "desc" },
      putVol: { key: "volume", dir: "desc" },
      strikes: { key: "totalOI", dir: "desc" },
    };

    const fmt = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");
    const fmtChg = n => { if(n==null||n===0) return "0"; return (n>0?"+":"") + Number(n).toLocaleString("en-US"); };
    const chgClass = n => n>0 ? "pos" : n<0 ? "neg" : "mu";

    function onRowClick(tr) {
      const table = tr.closest("table");
      if (table) table.querySelectorAll("tr.row-selected").forEach(r => { if(r!==tr) r.classList.remove("row-selected"); });
      tr.classList.toggle("row-selected");
    }

    function arrow(state, k) {
      if (state.key !== k) return '<span style="opacity:.4">↕</span>';
      return state.dir === "desc" ? "↓" : "↑";
    }

    function setSort(table, key) {
      const s = sortState[table];
      if (s.key === key) s.dir = s.dir === "desc" ? "asc" : "desc";
      else { s.key = key; s.dir = "desc"; }
      applyFilters();
    }

    function sortRows(rows, state, getters) {
      return [...rows].sort((a, b) => {
        const g = getters[state.key] || getters.default;
        const va = g(a), vb = g(b);
        return state.dir === "desc" ? vb - va : va - vb;
      });
    }

    function getFilters() {
      return {
        minOI: parseInt(document.getElementById("minOI").value, 10) || 0,
        minVol: parseInt(document.getElementById("minVol").value, 10) || 0,
        near: document.getElementById("nearMoney").checked,
        rangePct: parseFloat(document.getElementById("nearRange").value) || 8,
      };
    }

    function passNear(strike, close, rangePct) {
      if (!close) return true;
      const pct = Math.abs(strike - close) / close * 100;
      return pct <= rangePct;
    }

    function currentU() {
      const r = reports[curDate];
      if (!r) return null;
      return r.underlyings[curHkats];
    }

    function applyFilters() {
      const u = currentU();
      if (!u) return;
      const f = getFilters();
      const close = u.close || 0;
      document.getElementById("centerLabel").textContent = close
        ? (f.near ? `中心 ${close} ±${f.rangePct}%` : `中心 ${close}`)
        : "中心: —";

      const wallG = {
        strike: x => +x.strike || 0,
        oi: x => +x.oi || 0,
        chg: x => +x.oiChange || 0,
        volume: x => +x.volume || 0,
        default: x => +x.oi || 0,
      };

      let calls = (u.callWalls || []).filter(z =>
        (z.oi || 0) >= f.minOI &&
        (z.volume || 0) >= f.minVol &&
        (!f.near || passNear(z.strike, close, f.rangePct))
      );
      let puts = (u.putWalls || []).filter(z =>
        (z.oi || 0) >= f.minOI &&
        (z.volume || 0) >= f.minVol &&
        (!f.near || passNear(z.strike, close, f.rangePct))
      );
      let callV = (u.callVolWalls || []).filter(z =>
        (z.volume || 0) >= f.minVol &&
        (!f.near || passNear(z.strike, close, f.rangePct))
      );
      let putV = (u.putVolWalls || []).filter(z =>
        (z.volume || 0) >= f.minVol &&
        (!f.near || passNear(z.strike, close, f.rangePct))
      );

      calls = sortRows(calls, sortState.callWall, wallG);
      puts = sortRows(puts, sortState.putWall, wallG);
      callV = sortRows(callV, sortState.callVol, wallG);
      putV = sortRows(putV, sortState.putVol, wallG);

      const sc = sortState.callWall, sp = sortState.putWall, sv = sortState.callVol, spv = sortState.putVol;

      document.getElementById("zones").innerHTML = `
        <div class="section">
          <div class="section-header"><h2 class="em">Call 重貨區</h2><span class="tag">${u.frontExpiry||""} · ${calls.length}</span></div>
          <table><thead><tr>
            <th class="sortable ${sc.key==="strike"?"active":""}" onclick="setSort('callWall','strike')">行使價 ${arrow(sc,"strike")}</th>
            <th class="tr sortable ${sc.key==="oi"?"active":""}" onclick="setSort('callWall','oi')">OI ${arrow(sc,"oi")}</th>
            <th class="tr sortable ${sc.key==="chg"?"active":""}" onclick="setSort('callWall','chg')">Δ ${arrow(sc,"chg")}</th>
            <th class="tr sortable ${sc.key==="volume"?"active":""}" onclick="setSort('callWall','volume')">成交 ${arrow(sc,"volume")}</th>
          </tr></thead>
          <tbody>${calls.length ? calls.map(z=>`<tr onclick="onRowClick(this)"><td class="mono em">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td><td class="tr mono mu">${fmt(z.volume||0)}</td></tr>`).join("") : '<tr><td colspan="4" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table>
        </div>
        <div class="section">
          <div class="section-header"><h2 class="ro">Put 重貨區</h2><span class="tag">${u.frontExpiry||""} · ${puts.length}</span></div>
          <table><thead><tr>
            <th class="sortable ${sp.key==="strike"?"active":""}" onclick="setSort('putWall','strike')">行使價 ${arrow(sp,"strike")}</th>
            <th class="tr sortable ${sp.key==="oi"?"active":""}" onclick="setSort('putWall','oi')">OI ${arrow(sp,"oi")}</th>
            <th class="tr sortable ${sp.key==="chg"?"active":""}" onclick="setSort('putWall','chg')">Δ ${arrow(sp,"chg")}</th>
            <th class="tr sortable ${sp.key==="volume"?"active":""}" onclick="setSort('putWall','volume')">成交 ${arrow(sp,"volume")}</th>
          </tr></thead>
          <tbody>${puts.length ? puts.map(z=>`<tr onclick="onRowClick(this)"><td class="mono ro">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td><td class="tr mono mu">${fmt(z.volume||0)}</td></tr>`).join("") : '<tr><td colspan="4" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table>
        </div>
        <div class="section">
          <div class="section-header"><h2 class="em">Call 成交量重區</h2><span class="tag">Volume · ${callV.length}</span></div>
          <table><thead><tr>
            <th class="sortable ${sv.key==="strike"?"active":""}" onclick="setSort('callVol','strike')">行使價 ${arrow(sv,"strike")}</th>
            <th class="tr sortable ${sv.key==="volume"?"active":""}" onclick="setSort('callVol','volume')">成交量 ${arrow(sv,"volume")}</th>
          </tr></thead>
          <tbody>${callV.length ? callV.map(z=>`<tr onclick="onRowClick(this)"><td class="mono em">${z.strike}</td><td class="tr mono">${fmt(z.volume)}</td></tr>`).join("") : '<tr><td colspan="2" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table>
        </div>
        <div class="section">
          <div class="section-header"><h2 class="ro">Put 成交量重區</h2><span class="tag">Volume · ${putV.length}</span></div>
          <table><thead><tr>
            <th class="sortable ${spv.key==="strike"?"active":""}" onclick="setSort('putVol','strike')">行使價 ${arrow(spv,"strike")}</th>
            <th class="tr sortable ${spv.key==="volume"?"active":""}" onclick="setSort('putVol','volume')">成交量 ${arrow(spv,"volume")}</th>
          </tr></thead>
          <tbody>${putV.length ? putV.map(z=>`<tr onclick="onRowClick(this)"><td class="mono ro">${z.strike}</td><td class="tr mono">${fmt(z.volume)}</td></tr>`).join("") : '<tr><td colspan="2" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table>
        </div>`;

      // strikes
      const ss = sortState.strikes;
      const strikeG = {
        strike: x => +x.strike || 0,
        callOI: x => +x.callOI || 0,
        putOI: x => +x.putOI || 0,
        callVol: x => +x.callVol || 0,
        putVol: x => +x.putVol || 0,
        callChg: x => +x.callChange || 0,
        putChg: x => +x.putChange || 0,
        totalOI: x => (+x.callOI||0)+(+x.putOI||0),
        default: x => (+x.callOI||0)+(+x.putOI||0),
      };
      let rows = (u.strikes || []).filter(s => {
        const oi = (s.callOI||0)+(s.putOI||0);
        const vol = (s.callVol||0)+(s.putVol||0);
        if (oi < f.minOI) return false;
        if (vol < f.minVol) return false;
        if (f.near && !passNear(s.strike, close, f.rangePct)) return false;
        return true;
      });
      rows = sortRows(rows, ss, strikeG);

      document.getElementById("strikes").innerHTML = `
        <div class="section">
          <div class="section-header"><h2>行使價分佈</h2><span class="tag">顯示 ${rows.length} / ${(u.strikes||[]).length} · ${u.frontExpiry||""}</span></div>
          <table>
            <thead><tr>
              <th class="tr sortable ${ss.key==="callVol"?"active":""}" onclick="setSort('strikes','callVol')">Call Vol ${arrow(ss,"callVol")}</th>
              <th class="tr sortable ${ss.key==="callOI"?"active":""}" onclick="setSort('strikes','callOI')">Call OI ${arrow(ss,"callOI")}</th>
              <th class="tr sortable ${ss.key==="callChg"?"active":""}" onclick="setSort('strikes','callChg')">Δ ${arrow(ss,"callChg")}</th>
              <th class="tc sortable ${ss.key==="strike"?"active":""}" onclick="setSort('strikes','strike')">行使價 ${arrow(ss,"strike")}</th>
              <th class="tr sortable ${ss.key==="putChg"?"active":""}" onclick="setSort('strikes','putChg')">Δ ${arrow(ss,"putChg")}</th>
              <th class="tr sortable ${ss.key==="putOI"?"active":""}" onclick="setSort('strikes','putOI')">Put OI ${arrow(ss,"putOI")}</th>
              <th class="tr sortable ${ss.key==="putVol"?"active":""}" onclick="setSort('strikes','putVol')">Put Vol ${arrow(ss,"putVol")}</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(s=>`<tr onclick="onRowClick(this)">
                <td class="tr mono mu">${fmt(s.callVol||0)}</td>
                <td class="tr mono em">${fmt(s.callOI||0)}</td>
                <td class="tr mono ${chgClass(s.callChange)}">${fmtChg(s.callChange)}</td>
                <td class="tc mono" style="font-weight:600">${s.strike}</td>
                <td class="tr mono ${chgClass(s.putChange)}">${fmtChg(s.putChange)}</td>
                <td class="tr mono ro">${fmt(s.putOI||0)}</td>
                <td class="tr mono mu">${fmt(s.putVol||0)}</td>
              </tr>`).join("") : '<tr><td colspan="7" class="mu tc" style="padding:16px">無符合條件（降低最低 OI 或關閉近價）</td></tr>'}
            </tbody>
          </table>
        </div>`;
    }

    function onCal() {
      const v = document.getElementById("dateCal").value;
      if (!v) return;
      if (reports[v]) render(v);
      else {
        const c = dates.filter(d=>d<=v);
        if (c.length) render(c[0]);
        else if (dates.length) render(dates[dates.length-1]);
      }
    }

    function selectStock(hkats) {
      curHkats = hkats;
      document.querySelectorAll(".stock-tab").forEach(b=>{
        b.classList.toggle("active", b.dataset.hkats===hkats);
      });
      const u = currentU();
      if (!u) return;
      document.getElementById("summary").innerHTML = `
        <div class="card"><div class="label">正股收市</div><div class="value">${u.close?u.close.toFixed(2):"—"}</div><div class="subv">${u.name||""}</div></div>
        <div class="card"><div class="label">即月</div><div class="value" style="font-size:.95rem">${u.frontExpiry||"—"}</div></div>
        <div class="card"><div class="label">Call OI</div><div class="value">${fmt(u.callOI)}</div></div>
        <div class="card"><div class="label">Put OI</div><div class="value">${fmt(u.putOI)}</div></div>
        <div class="card"><div class="label">總 OI</div><div class="value">${fmt(u.oi)}</div></div>
        <div class="card"><div class="label">成交量</div><div class="value">${fmt(u.volume)}</div></div>
      `;
      applyFilters();
    }

    function render(date) {
      const r = reports[date];
      if (!r) { document.getElementById("status").textContent="無資料"; return; }
      curDate = date;
      document.getElementById("status").textContent = `顯示 ${date} · ${dates.length} 個交易日 · 5 隻股票期權`;
      document.getElementById("dateSelect").innerHTML = dates.map(d=>`<option value="${d}" ${d===date?"selected":""}>${d}</option>`).join("");
      const cal = document.getElementById("dateCal");
      if (cal) { cal.value=date; if(dates.length){ cal.min=dates[dates.length-1]; cal.max=dates[0]; } }
      document.getElementById("src").href = r.sourceUrl || "#";

      const order = ["TCH","ALB","MIU","MET","HEX"];
      document.getElementById("stockTabs").innerHTML = order.map(h=>{
        const u = r.underlyings[h];
        if (!u) return "";
        return `<button class="stock-tab" data-hkats="${h}" onclick="selectStock('${h}')">${u.code.replace(/^0+/,"")} ${u.name.split(" ")[0]}</button>`;
      }).join("");

      if (!curHkats || !r.underlyings[curHkats]) curHkats = order.find(h=>r.underlyings[h]) || null;
      if (curHkats) selectStock(curHkats);
    }

    if (dates.length) render(dates[0]);
    else document.getElementById("status").textContent = "尚未有數據。請執行 python3 fetch_stock_oi.py";
  </script>
</body>
</html>
