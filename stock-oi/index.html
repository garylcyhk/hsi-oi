<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../auth.js"></script>

<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股票期權未平倉 · Exodus Trading Group</title>
<style>
:root{--font-scale:100%;--bg:#09090b;--card:#18181b;--border:#27272a;--text:#fafafa;--muted:#a1a1aa;--emerald:#34d399;--rose:#fb7185}
html{font-size:var(--font-scale)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{border-bottom:1px solid var(--border);background:rgba(24,24,27,.92);position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;font-weight:600} h1 span{color:var(--muted);font-weight:400;font-size:.85rem}
.sub{font-size:.72rem;color:var(--muted)}
.site-nav{display:flex;gap:6px;margin-top:6px}
.site-nav a{font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-decoration:none}
.site-nav a.active{background:#059669;color:#fff;border-color:#059669}
.site-nav a:hover:not(.active){border-color:#555;color:var(--text)}
select,input[type=date],input[type=number]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.8rem}
input[type=number]{width:78px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:.75rem;cursor:pointer}
.btn:hover{border-color:#555}
.container{padding:12px 16px 32px;max-width:100%;margin:0 auto}
.stock-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.stock-tab{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:.8rem}
.stock-tab.active{background:#059669;color:#fff;border-color:#059669}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin:8px 0 0}
.tab-btn{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--emerald);border-bottom-color:var(--emerald)}
.tab-panel{display:none;padding-top:12px}.tab-panel.active{display:block}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin:12px 0;font-size:.78rem}
.filters label{color:var(--muted);display:flex;align-items:center;gap:6px}
.filters input[type=checkbox]{accent-color:#34d399;width:14px;height:14px}
.futures-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:700px){.futures-bar{grid-template-columns:1fr}}
.fut-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.fut-card h3{font-size:.8rem;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
.fut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.fut-item .fl{font-size:.68rem;color:var(--muted)}.fut-item .fv{font-size:.95rem;font-weight:600;font-family:ui-monospace,monospace}
.fut-item .fs{font-size:.72rem;margin-top:1px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px}
.card .label{font-size:.7rem;color:var(--muted)}.card .value{font-size:1.1rem;font-weight:600;font-family:ui-monospace,monospace}.card .subv{font-size:.75rem}
.levels-card,.day-change{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0}
.levels-card h3,.day-change h3{font-size:.8rem;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
.lvl-grid,.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.lvl-grid,.dc-grid,.zones{grid-template-columns:1fr!important}}
.lvl-item,.dc-item{font-family:ui-monospace,monospace;font-size:.82rem;padding:3px 0}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.section-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.section-header h2{font-size:.85rem;font-weight:500}
.tag{font-size:.7rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:8px 12px;font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:7px 12px;border-bottom:1px solid #1f1f23}
.tr{text-align:right}.tc{text-align:center}
.mono{font-family:ui-monospace,monospace}
.em{color:var(--emerald)}.ro{color:var(--rose)}.pos{color:var(--emerald)}.neg{color:var(--rose)}.mu{color:var(--muted)}
tbody tr{cursor:pointer} tbody tr:hover td{background:rgba(39,39,42,.35)}
tr.row-selected td{background:rgba(16,185,129,.28)!important;box-shadow:inset 3px 0 0 #34d399}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--text)} th.sortable.active{color:var(--emerald)}
tr.hl-oi td{background:rgba(52,211,153,.08)} tr.hl-vol td{background:rgba(251,191,36,.08)} tr.hl-abs td{background:rgba(96,165,250,.1)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#121214;border:1px solid var(--border);border-radius:10px;padding:18px;width:min(420px,92vw);max-height:85vh;overflow:auto}
.modal h3{font-size:1rem;margin-bottom:14px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #27272a;font-size:.85rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-primary{background:#059669;border:none;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn-secondary{background:#27272a;border:none;color:var(--text);border-radius:6px;padding:7px 14px;cursor:pointer}
footer{text-align:center;padding:20px;font-size:.7rem;color:#52525b} footer a{color:var(--muted)}
.note{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.print-only{display:none}
@media print{
  body{background:#fff;color:#111} header .site-nav,.filters,.tab-bar,.btn,.stock-tabs,.modal-overlay{display:none!important}
  .print-only{display:block} .tab-panel{display:block!important} .card,.section,.levels-card,.day-change{border:1px solid #ccc;break-inside:avoid}
  a{color:#111} table{font-size:9pt}
}


/* ========== Unified responsive (match HSI main) ========== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; max-width: 100vw; }
.container, .tab-panels, header .inner {
  width: 100%;
  max-width: 100%;
  margin-left: auto;
  margin-right: auto;
  padding-left: 16px;
  padding-right: 16px;
  box-sizing: border-box;
}
header { width: 100%; box-sizing: border-box; }
.filters { flex-wrap: wrap; max-width: 100%; }
.tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}
.section, .card, .cmp-card, .an-card, .fut-card {
  max-width: 100%;
}
.section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; max-width: 100%; }
img, svg { max-width: 100%; height: auto; }

@media (max-width: 1199px) {
  .zones { grid-template-columns: 1fr 1fr !important; }
}
@media (min-width: 1200px) {
  .zones { grid-template-columns: 1fr 1fr 1fr 1fr !important; }
}
@media (min-width: 1400px) {
  .container, .tab-panels, header .inner, .tab-bar {
    padding-left: 24px;
    padding-right: 24px;
  }
}

@media (max-width: 900px) {
  .container, .tab-panels { padding-left: 12px; padding-right: 12px; }
  header { padding-left: 12px; padding-right: 12px; }
  h1 { font-size: 1rem; }
  .grid-summary, .summary-grid { grid-template-columns: 1fr 1fr !important; }
  .cmp-grid, .analysis { grid-template-columns: 1fr !important; }
}

@media (max-width: 800px) {
  .zones, .futures-bar, .fut-grid, .compare, .lvl-grid, .dc-grid { grid-template-columns: 1fr !important; }
  .cmp-grid { grid-template-columns: 1fr !important; }
}

@media (max-width: 768px) {
  header {
    flex-direction: column !important;
    align-items: flex-start !important;
    padding: 10px 12px !important;
  }
  header .inner {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
    padding: 0 10px !important;
    width: 100%;
  }
  header > div:last-child {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-start !important;
  }
  .site-nav { width: 100%; flex-wrap: wrap; }
  .product-toggle { width: 100%; }
  .filters { padding: 8px 10px; width: 100%; }
  .filters label { font-size: 0.72rem; }
  .levels-card, .day-change .dc-grid { grid-template-columns: 1fr !important; }
  .stock-tabs { flex-wrap: wrap; width: 100%; }
  table { font-size: 0.75rem; }
  th, td { padding: 6px 8px !important; }
  .btn { padding: 6px 10px; }
  select, input[type="date"], input[type="number"], input[type="text"] {
    font-size: 16px !important;
  }
  .metrics { grid-template-columns: 1fr 1fr !important; }
  .an-grid, .regime { grid-template-columns: 1fr 1fr !important; }
  .modal { width: min(420px, 94vw) !important; }
}

@media (max-width: 480px) {
  h1 { font-size: 0.95rem; }
  h1 span { display: block; font-size: 0.72rem; margin-top: 2px; }
  .tab-btn, .prod-btn { font-size: 0.7rem; padding: 5px 8px; }
  .sub { font-size: 0.68rem; }
  .grid-summary, .summary-grid { grid-template-columns: 1fr !important; }
}


/* Basket heat + wall migration */
.basket-wrap{margin:12px 0}
.basket-wrap h3{font-size:.85rem;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.basket-table{width:100%;border-collapse:collapse;font-size:.8rem}
.basket-table th{text-align:left;padding:8px 10px;color:var(--muted);font-size:.7rem;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
.basket-table td{padding:8px 10px;border-bottom:1px solid #1f1f23;font-family:ui-monospace,monospace;white-space:nowrap}
.basket-table tr:hover{background:rgba(255,255,255,.03)}
.basket-table .tr{text-align:right}
.bias-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:500}
.bias-res{background:rgba(244,63,94,.15);color:var(--rose)}
.bias-sup{background:rgba(52,211,153,.15);color:var(--emerald)}
.bias-mid{background:rgba(251,191,36,.12);color:#fbbf24}
.bias-far{background:rgba(161,161,170,.12);color:var(--muted)}

.mig-wrap h3{font-size:.85rem;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.mig-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.mig-grid{grid-template-columns:1fr}.basket-table{font-size:.72rem}}
.mig-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}
.mig-card h4{font-size:.75rem;margin-bottom:8px;font-weight:500}
.mig-table{width:100%;border-collapse:collapse;font-size:.75rem}
.mig-table th,.mig-table td{padding:5px 8px;border-bottom:1px solid #1f1f23;font-family:ui-monospace,monospace}
.mig-table th{color:var(--muted);font-size:.68rem;font-weight:500;text-align:right}
.mig-table th:first-child,.mig-table td:first-child{text-align:left}
.mig-table td{text-align:right}

.brand-name{color:var(--emerald);font-weight:500;letter-spacing:.02em}
footer p:first-child{font-size:.8rem}

.brand-lockup{display:flex;align-items:center;gap:12px}
.brand-lockup img{height:40px;width:auto;border-radius:6px;object-fit:cover;flex-shrink:0}
.brand-lockup .brand-text{display:flex;flex-direction:column;gap:2px}
.brand-lockup .brand-text .brand-title{font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
@media(max-width:768px){.brand-lockup img{height:32px}}

.brand-logo-link{display:block;line-height:0;border-radius:6px;overflow:hidden}
.brand-logo-link img{height:40px;width:auto;border-radius:6px;object-fit:cover;display:block;transition:opacity .15s}
.brand-logo-link:hover img{opacity:.85}
.brand-lockup{display:flex;align-items:center;gap:12px}
@media(max-width:768px){.brand-logo-link img{height:32px}}

/* Header menu (hamburger) */
.header-menu{position:relative;display:inline-flex;align-items:center}
.menu-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;padding:0;border-radius:8px;
  background:var(--card,#18181b);border:1px solid var(--border,#27272a);
  color:var(--text,#e4e4e7);cursor:pointer;
}
.menu-toggle:hover{border-color:#3f3f46;background:#1f1f23}
.menu-toggle svg{width:18px;height:18px;display:block}
.menu-dropdown{
  display:none;position:absolute;right:0;top:calc(100% + 6px);
  min-width:140px;padding:6px;border-radius:10px;
  background:#18181b;border:1px solid #27272a;
  box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:50;
}
.header-menu.open .menu-dropdown{display:block}
.menu-dropdown button{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 12px;border:none;border-radius:7px;
  background:transparent;color:var(--text,#e4e4e7);
  font-size:.82rem;cursor:pointer;text-align:left;
}
.menu-dropdown button:hover{background:#27272a}


.menu-dropdown a{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 12px;border-radius:7px;
  color:var(--text,#e4e4e7);font-size:.82rem;text-decoration:none;
  box-sizing:border-box;
}
.menu-dropdown a:hover{background:#27272a}
.menu-dropdown a.menu-active{color:#34d399;background:rgba(52,211,153,.1)}
.menu-section{font-size:.68rem;color:#71717a;padding:6px 12px 4px;letter-spacing:.04em}
.menu-divider{height:1px;background:#27272a;margin:6px 4px}
.menu-dropdown{min-width:168px}

.site-nav{display:none!important}

.tab-dragging{ opacity:.45; }
.tab-bar button, .csv-subtabs button, .stock-tabs button, .fut-tabs button { cursor:grab; }
</style>
</head>

  <div>

<script>
const reports = window.STOCK_OI || {};
const dates = Object.keys(reports).sort().reverse();
let curDate = dates[0] || null;
let curHkats = null;
const DEFAULTS = { minOI:50, minVol:0, onlyActive:true, topN:5, hlOI:true, hlVol:true, fontScale:100 };
function loadSettings(){ try{ return {...DEFAULTS, ...JSON.parse(localStorage.getItem("stock_oi_settings")||"{}")}; }catch(e){ return {...DEFAULTS}; } }
let settings = loadSettings();
let minOI=settings.minOI, minVol=settings.minVol, onlyActive=settings.onlyActive!==false;
let topN=settings.topN||5, hlOI=settings.hlOI!==false, hlVol=settings.hlVol!==false;
let fontScale=settings.fontScale||100;
document.documentElement.style.setProperty("--font-scale", fontScale+"%");

const sortState = {
  callWall:{key:"oi",dir:"desc"}, putWall:{key:"oi",dir:"desc"},
  callVol:{key:"volume",dir:"desc"}, putVol:{key:"volume",dir:"desc"},
  strikes:{key:"totalOI",dir:"desc"},
  nCall:{key:"oi",dir:"desc"}, nPut:{key:"oi",dir:"desc"}
};

const fmt = n => (n==null||isNaN(n))?"—":Number(n).toLocaleString("en-US");
const fmtChg = n => { if(n==null||n===0) return "0"; return (n>0?"+":"")+Number(n).toLocaleString("en-US"); };
const chgClass = n => n>0?"pos":n<0?"neg":"mu";


function renderFutures(r){
  const box=document.getElementById("futuresBar");
  if(!box) return;
  const fut=(r&&r.futures)||{};
  const hsi=fut.hsif||{}, mhi=fut.mhif||{};
  const hf=hsi.front||{}, mf=mhi.front||{};
  const ht=hsi.total||{}, mt=mhi.total||{};
  if(!hf.settle && !mf.settle){ box.innerHTML=""; return; }
  function card(title,f,t){
    if(!f.settle) return `<div class="fut-card"><h3>${title}</h3><div class="mu">無資料</div></div>`;
    return `<div class="fut-card">
      <h3><span>${title}</span><span class="tag">${f.month||""}</span></h3>
      <div class="fut-grid">
        <div class="fut-item"><div class="fl">結算價</div><div class="fv">${fmt(f.settle)}</div><div class="fs ${chgClass(f.settleChange)}">${fmtChg(f.settleChange)}</div></div>
        <div class="fut-item"><div class="fl">成交量</div><div class="fv">${fmt(f.volume)}</div></div>
        <div class="fut-item"><div class="fl">未平倉</div><div class="fv">${fmt(f.oi)}</div><div class="fs ${chgClass(f.oiChange)}">${fmtChg(f.oiChange)}</div></div>
        <div class="fut-item"><div class="fl">開 / 高 / 低</div><div class="fv" style="font-size:.8rem">${fmt(f.open)} / ${fmt(f.high)} / ${fmt(f.low)}</div></div>
        <div class="fut-item"><div class="fl">全月份 OI</div><div class="fv">${fmt(t.oi||f.oi)}</div><div class="fs ${chgClass(t.oiChange)}">${t.oiChange!=null?fmtChg(t.oiChange):""}</div></div>
      </div>
    </div>`;
  }
  box.innerHTML = `<div class="futures-bar">${card("恒生指數期貨 HSI",hf,ht)}${card("小型恒指期貨 MHI",mf,mt)}</div>`;
}

function switchTab(name){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("active", p.id==="tab-"+name));
}
function onRowClick(tr){
  const table=tr.closest("table");
  if(table) table.querySelectorAll("tr.row-selected").forEach(r=>{ if(r!==tr) r.classList.remove("row-selected"); });
  tr.classList.toggle("row-selected");
}
function arrow(state,k){ if(state.key!==k) return '<span style="opacity:.4">↕</span>'; return state.dir==="desc"?"↓":"↑"; }
function setSort(table,key){
  const s=sortState[table];
  if(s.key===key) s.dir=s.dir==="desc"?"asc":"desc"; else { s.key=key; s.dir="desc"; }
  applyFilters();
}
function sortRows(rows,state,getters){
  return [...rows].sort((a,b)=>{ const g=getters[state.key]||getters.default; return state.dir==="desc"?g(b)-g(a):g(a)-g(b); });
}
function getFilters(){
  return {
    minOI: parseInt(document.getElementById("minOI").value,10)||0,
    minVol: parseInt(document.getElementById("minVol").value,10)||0,
    near: document.getElementById("nearMoney").checked,
    rangePct: parseFloat(document.getElementById("nearRange").value)||8,
  };
}
function passNear(strike,close,pct){ if(!close) return true; return Math.abs(strike-close)/close*100 <= pct; }
function currentU(){ const r=reports[curDate]; return r? r.underlyings[curHkats]:null; }
function prevU(){
  if(!curDate||!curHkats) return null;
  const idx=dates.indexOf(curDate);
  if(idx<0||idx>=dates.length-1) return null;
  const prev=reports[dates[idx+1]];
  return prev? prev.underlyings[curHkats]:null;
}

function openSettings(){
  document.getElementById("setFontScale").value=String(fontScale);
  document.getElementById("setMinOI").value=minOI;
  document.getElementById("setMinVol").value=minVol;
  document.getElementById("setOnlyActive").checked=onlyActive;
  document.getElementById("setTopN").value=topN;
  document.getElementById("setHlOI").checked=hlOI;
  document.getElementById("setHlVol").checked=hlVol;
  document.getElementById("settingsModal").classList.add("open");
}
function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }
function saveSettings(){
  fontScale=parseInt(document.getElementById("setFontScale").value,10)||100;
  minOI=parseInt(document.getElementById("setMinOI").value,10)||0;
  minVol=parseInt(document.getElementById("setMinVol").value,10)||0;
  onlyActive=document.getElementById("setOnlyActive").checked;
  topN=parseInt(document.getElementById("setTopN").value,10)||5;
  hlOI=document.getElementById("setHlOI").checked;
  hlVol=document.getElementById("setHlVol").checked;
  document.documentElement.style.setProperty("--font-scale", fontScale+"%");
  document.getElementById("minOI").value=minOI;
  document.getElementById("minVol").value=minVol;
  settings={minOI,minVol,onlyActive,topN,hlOI,hlVol,fontScale};
  localStorage.setItem("stock_oi_settings", JSON.stringify(settings));
  closeSettings(); applyFilters();
}
function resetSettings(){
  settings={...DEFAULTS}; minOI=50; minVol=0; onlyActive=true; topN=5; hlOI=true; hlVol=true; fontScale=100;
  document.documentElement.style.setProperty("--font-scale","100%");
  localStorage.setItem("stock_oi_settings", JSON.stringify(settings));
  document.getElementById("minOI").value=50; document.getElementById("minVol").value=0;
  closeSettings(); applyFilters();
}

function wallG(){ return { strike:x=>+x.strike||0, oi:x=>+x.oi||0, chg:x=>+x.oiChange||0, volume:x=>+x.volume||0, default:x=>+x.oi||0 }; }

  const u=currentU(); if(!u) return;
  const f=getFilters(); const close=u.close||0;
  document.getElementById("centerLabel").textContent = close ? (f.near?`中心 ${close} ±${f.rangePct}%`:`中心 ${close}`) : "中心: —";

  // Levels

  document.getElementById("levelsCard").innerHTML = `

      <div><div class="tag em" style="margin-bottom:4px">Call 關鍵阻力</div>
        ${topC.map(z=>`<div class="lvl-item em">${z.strike} OI ${fmt(z.oi)} <span class="${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</span></div>`).join("")||'<div class="mu">—</div>'}
      </div>
      <div><div class="tag ro" style="margin-bottom:4px">Put 關鍵支持</div>

    const tc=map(u.callWalls), yc=map(pu.callWalls), tp=map(u.putWalls), yp=map(pu.putWalls);
    const keysC=[...new Set([...Object.keys(tc),...Object.keys(yc)])].slice(0,8);
    const keysP=[...new Set([...Object.keys(tp),...Object.keys(yp)])].slice(0,8);
    const line=(side,k,t,y)=>{
      const a=t[k], b=y[k];

      const chg=a&&b?(a.oi-b.oi):(a?a.oiChange:0);
      return `<div class="dc-item ${side}">${k} OI ${fmt(oi)} <span class="${chgClass(chg)}">(${fmtChg(chg)})</span></div>`;

    document.getElementById("dayChange").innerHTML = `
      <h3><span>今日 vs 昨日牆位</span><span class="tag">${curDate} vs ${prevDate}</span></h3>

        <div><div class="tag">Call 牆</div>${keysC.map(k=>line("em",k,tc,yc)).join("")}</div>
        <div><div class="tag">Put 牆</div>${keysP.map(k=>line("ro",k,tp,yp)).join("")}</div>
      </div>`;
  } else {
    document.getElementById("dayChange").innerHTML = `<h3>今日 vs 昨日牆位</h3><div class="mu">需要至少兩個交易日數據</div>`;
  }

  const filtWall = arr => (arr||[]).filter(z =>
    (z.oi||0)>=f.minOI && (z.volume||0)>=f.minVol && (!f.near||passNear(z.strike,close,f.rangePct))
  );
  const filtVol = arr => (arr||[]).filter(z =>
    (z.volume||0)>=f.minVol && (!f.near||passNear(z.strike,close,f.rangePct))
  );

  let calls=sortRows(filtWall(u.callWalls), sortState.callWall, wallG());
  let puts=sortRows(filtWall(u.putWalls), sortState.putWall, wallG());
  let callV=sortRows(filtVol(u.callVolWalls), sortState.callVol, wallG());
  let putV=sortRows(filtVol(u.putVolWalls), sortState.putVol, wallG());
  const nm=u.nextMonthZones||{};
  let nCalls=sortRows(filtWall(nm.callWalls), sortState.nCall, wallG());
  let nPuts=sortRows(filtWall(nm.putWalls), sortState.nPut, wallG());

  const th=(st,table,key,label,cls="")=>`<th class="${cls} sortable ${st.key===key?"active":""}" onclick="setSort('${table}','${key}')">${label} ${arrow(st,key)}</th>`;

      <tbody>${calls.length?calls.map(z=>`<tr onclick="onRowClick(this)"><td class="mono em">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td><td class="tr mono mu">${fmt(z.volume||0)}</td></tr>`).join(""):'<tr><td colspan="4" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table></div>
    <div class="section"><div class="section-header"><h2 class="ro">Put 重貨區</h2><span class="tag">${u.frontExpiry||""} · ${puts.length}</span></div>
      <table><thead><tr>${th(sp,"putWall","strike","行使價")}${th(sp,"putWall","oi","OI","tr")}${th(sp,"putWall","chg","Δ","tr")}${th(sp,"putWall","volume","成交","tr")}</tr></thead>
      <tbody>${puts.length?puts.map(z=>`<tr onclick="onRowClick(this)"><td class="mono ro">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td><td class="tr mono mu">${fmt(z.volume||0)}</td></tr>`).join(""):'<tr><td colspan="4" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table></div>
    <div class="section"><div class="section-header"><h2 class="em">Call 成交量重區</h2><span class="tag">${callV.length}</span></div>
      <table><thead><tr>${th(sv,"callVol","strike","行使價")}${th(sv,"callVol","volume","成交量","tr")}</tr></thead>
      <tbody>${callV.length?callV.map(z=>`<tr onclick="onRowClick(this)"><td class="mono em">${z.strike}</td><td class="tr mono">${fmt(z.volume)}</td></tr>`).join(""):'<tr><td colspan="2" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table></div>
    <div class="section"><div class="section-header"><h2 class="ro">Put 成交量重區</h2><span class="tag">${putV.length}</span></div>
      <table><thead><tr>${th(spv,"putVol","strike","行使價")}${th(spv,"putVol","volume","成交量","tr")}</tr></thead>
      <tbody>${putV.length?putV.map(z=>`<tr onclick="onRowClick(this)"><td class="mono ro">${z.strike}</td><td class="tr mono">${fmt(z.volume)}</td></tr>`).join(""):'<tr><td colspan="2" class="mu tc" style="padding:14px">無符合條件</td></tr>'}</tbody></table></div>
    <div class="section" style="grid-column:1/-1"><div class="section-header"><h2>下期重貨區 Next Expiry</h2><span class="tag">${nm.expiry||u.nextExpiry||"—"}</span></div></div>
    <div class="section"><div class="section-header"><h2 class="em">下期 Call</h2><span class="tag">${nCalls.length}</span></div>
      <table><thead><tr>${th(snc,"nCall","strike","行使價")}${th(snc,"nCall","oi","OI","tr")}${th(snc,"nCall","chg","Δ","tr")}</tr></thead>
      <tbody>${nCalls.length?nCalls.map(z=>`<tr onclick="onRowClick(this)"><td class="mono em">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td></tr>`).join(""):'<tr><td colspan="3" class="mu tc" style="padding:14px">無</td></tr>'}</tbody></table></div>
    <div class="section"><div class="section-header"><h2 class="ro">下期 Put</h2><span class="tag">${nPuts.length}</span></div>
      <table><thead><tr>${th(snp,"nPut","strike","行使價")}${th(snp,"nPut","oi","OI","tr")}${th(snp,"nPut","chg","Δ","tr")}</tr></thead>
      <tbody>${nPuts.length?nPuts.map(z=>`<tr onclick="onRowClick(this)"><td class="mono ro">${z.strike}</td><td class="tr mono">${fmt(z.oi)}</td><td class="tr mono ${chgClass(z.oiChange)}">${fmtChg(z.oiChange)}</td></tr>`).join(""):'<tr><td colspan="3" class="mu tc" style="padding:14px">無</td></tr>'}</tbody></table></div>`;

  // strikes
  const ss=sortState.strikes;
  const strikeG={ strike:x=>+x.strike||0, callOI:x=>+x.callOI||0, putOI:x=>+x.putOI||0, callVol:x=>+x.callVol||0, putVol:x=>+x.putVol||0,
    callChg:x=>+x.callChange||0, putChg:x=>+x.putChange||0, totalOI:x=>(+x.callOI||0)+(+x.putOI||0), default:x=>(+x.callOI||0)+(+x.putOI||0) };
  let rows=(u.strikes||[]).filter(s=>{
    const oi=(s.callOI||0)+(s.putOI||0), vol=(s.callVol||0)+(s.putVol||0);
    if(onlyActive && oi===0 && vol===0) return false;
    if(oi<f.minOI) return false;
    if(vol<f.minVol) return false;
    if(f.near && !passNear(s.strike,close,f.rangePct)) return false;
    return true;
  });
  rows=sortRows(rows, ss, strikeG);
  const byOi=[...rows].sort((a,b)=>((b.callOI||0)+(b.putOI||0))-((a.callOI||0)+(a.putOI||0))).slice(0,topN).map(x=>x.strike);
  const byVol=[...rows].sort((a,b)=>((b.callVol||0)+(b.putVol||0))-((a.callVol||0)+(a.putVol||0))).slice(0,topN).map(x=>x.strike);

        <td class="tr mono ${chgClass(s.putChange)}">${fmtChg(s.putChange)}</td>
        <td class="tr mono ro">${fmt(s.putOI||0)}</td><td class="tr mono mu">${fmt(s.putVol||0)}</td>
      </tr>`;
    }).join(""):'<tr><td colspan="7" class="mu tc" style="padding:16px">無符合條件</td></tr>'}</tbody></table></div>`;
}

const STOCK_ORDER = ["TCH","ALB","MIU","MET","HEX","KST"];

function nearestWalls(u){
  const close = u.close || 0;
  const calls = (u.callWalls || []).slice().sort((a,b)=>a.strike-b.strike);
  const puts = (u.putWalls || []).slice().sort((a,b)=>a.strike-b.strike);
  // Call wall above or at close (resistance); else nearest call
  let nearCall = calls.filter(z => z.strike >= close).sort((a,b)=>a.strike-b.strike)[0]
    || calls.slice().sort((a,b)=>Math.abs(a.strike-close)-Math.abs(b.strike-close))[0] || null;
  // Put wall below or at close (support); else nearest put
  let nearPut = puts.filter(z => z.strike <= close).sort((a,b)=>b.strike-a.strike)[0]
    || puts.slice().sort((a,b)=>Math.abs(a.strike-close)-Math.abs(b.strike-close))[0] || null;
  return { nearCall, nearPut, close };
}

function stockBias(u){
  const { nearCall, nearPut, close } = nearestWalls(u);
  if (!close) return { label: "—", cls: "bias-far", distCall: null, distPut: null, nearCall, nearPut };
  const distCall = nearCall ? +(nearCall.strike - close).toFixed(2) : null;
  const distPut = nearPut ? +(close - nearPut.strike).toFixed(2) : null;
  // thresholds relative to price ~1.5% of close as "near"
  const band = Math.max(close * 0.015, close * 0.01);
  const callNear = distCall != null && distCall >= 0 && distCall <= band * 1.2;
  const putNear = distPut != null && distPut >= 0 && distPut <= band * 1.2;
  const callAbove = nearCall && nearCall.strike >= close;
  const putBelow = nearPut && nearPut.strike <= close;
  if (callNear && putNear && callAbove && putBelow) {
    return { label: "夾在牆中", cls: "bias-mid", distCall, distPut, nearCall, nearPut };
  }
  if (callNear && callAbove) {
    return { label: "潛在阻力", cls: "bias-res", distCall, distPut, nearCall, nearPut };
  }
  if (putNear && putBelow) {
    return { label: "潛在支持", cls: "bias-sup", distCall, distPut, nearCall, nearPut };
  }
  // closer side
  if (distCall != null && distPut != null) {
    if (Math.abs(distCall) < Math.abs(distPut) && callAbove)
      return { label: "偏近阻力", cls: "bias-res", distCall, distPut, nearCall, nearPut };
    if (Math.abs(distPut) < Math.abs(distCall) && putBelow)
      return { label: "偏近支持", cls: "bias-sup", distCall, distPut, nearCall, nearPut };
  }
  return { label: "牆遠", cls: "bias-far", distCall, distPut, nearCall, nearPut };
}

function renderBasketHeat(date){
  const box = document.getElementById("basketHeat");
  if (!box) return;
  const r = reports[date || curDate];
  if (!r) { box.innerHTML = ""; return; }
  const rows = STOCK_ORDER.map(h => {
    const u = r.underlyings[h];
    if (!u) return null;
    const b = stockBias(u);
    const code = String(u.code||"").replace(/^0+/,"") || u.code;
    const pc = u.callOI ? (u.putOI / u.callOI) : null;
    const dC = b.distCall == null ? "—" : ((b.distCall >= 0 ? "+" : "") + b.distCall);
    const dP = b.distPut == null ? "—" : ((b.distPut >= 0 ? "+" : "") + b.distPut);
    return `<tr onclick="selectStock('${h}')" style="cursor:pointer" title="點擊切換">
      <td><strong>${code}</strong> <span class="mu">${(u.name||"").split(" ")[0]}</span></td>
      <td class="tr">${u.close != null ? u.close.toFixed(2) : "—"}</td>
      <td class="tr em">${b.nearCall ? b.nearCall.strike : "—"}</td>
      <td class="tr">${dC}</td>
      <td class="tr ro">${b.nearPut ? b.nearPut.strike : "—"}</td>
      <td class="tr">${dP}</td>
      <td class="tr">${pc != null ? pc.toFixed(2) : "—"}</td>
      <td><span class="bias-tag ${b.cls}">${b.label}</span></td>
    </tr>`;
  }).filter(Boolean).join("");
  box.innerHTML = `
    <h3><span>籃子熱力 · 距牆偏向</span><span class="tag">${date || curDate} · 點列切換標的</span></h3>
    <div style="overflow-x:auto">
      <table class="basket-table">
        <thead><tr>
          <th>股票</th><th class="tr">收市</th>
          <th class="tr">Call牆</th><th class="tr">距Call</th>
          <th class="tr">Put牆</th><th class="tr">距Put</th>
          <th class="tr">P/C</th><th>偏向</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="mu">無資料</td></tr>'}</tbody>
      </table>
    </div>
    <div class="mu" style="font-size:.72rem;margin-top:6px">距Call = 牆 − 收市（正=阻力在上）· 距Put = 收市 − 牆（正=支持在下）· 「近」約 ±1–1.5%</div>
  `;
}

function renderWallMigration(hkats, date){
  const box = document.getElementById("wallMigration");
  if (!box) return;
  const h = hkats || curHkats;
  const d0 = date || curDate;
  if (!h || !d0) { box.innerHTML = ""; return; }
  const histDates = dates.filter(d => d <= d0).slice(0, 10).reverse(); // oldest → newest, up to 10
  const u0 = reports[d0]?.underlyings?.[h];
  if (!u0) { box.innerHTML = `<div class="mu">無遷移資料</div>`; return; }

  // Track top 4 call/put strikes from latest day
  const trackC = (u0.callWalls || []).slice(0, 4).map(z => z.strike);
  const trackP = (u0.putWalls || []).slice(0, 4).map(z => z.strike);

  function series(strikes, side){
    // side: call | put → look up oi from callWalls/putWalls or strikes
    return strikes.map(strike => {
      const cells = histDates.map(d => {
        const u = reports[d]?.underlyings?.[h];
        if (!u) return null;
        const list = side === "call" ? (u.callWalls || []) : (u.putWalls || []);
        let hit = list.find(z => Number(z.strike) === Number(strike));
        if (!hit && u.strikes) {
          const s = u.strikes.find(x => Number(x.strike) === Number(strike));
          if (s) hit = { oi: side === "call" ? s.callOI : s.putOI, oiChange: side === "call" ? s.callChange : s.putChange };
        }
        return hit ? (hit.oi || 0) : null;
      });
      return { strike, cells };
    });
  }

  const callSeries = series(trackC, "call");
  const putSeries = series(trackP, "put");
  const code = String(u0.code||"").replace(/^0+/,"") || u0.code;

  function migTable(title, colorCls, seriesData){
    const head = histDates.map(d => `<th>${d.slice(5)}</th>`).join(""); // MM-DD
    const body = seriesData.map(row => {
      const tds = row.cells.map((oi, i) => {
        if (oi == null) return `<td class="mu">—</td>`;
        const prev = i > 0 ? row.cells[i-1] : null;
        let chgCls = "";
        if (prev != null) {
          if (oi > prev) chgCls = "pos";
          else if (oi < prev) chgCls = "neg";
        }
        return `<td class="${chgCls}">${fmt(oi)}</td>`;
      }).join("");
      return `<tr><td class="${colorCls}">${row.strike}</td>${tds}</tr>`;
    }).join("");
    return `<div class="mig-card">
      <h4 class="${colorCls}">${title}</h4>
      <table class="mig-table">
        <thead><tr><th>行使價</th>${head}</tr></thead>
        <tbody>${body || '<tr><td colspan="99" class="mu">—</td></tr>'}</tbody>
      </table>
    </div>`;
  }

  box.innerHTML = `
    <h3><span>牆位遷移 · ${code} ${(u0.name||"").split(" ")[0]}</span>
      <span class="tag">近 ${histDates.length} 日 · 即月重貨 Top 4</span></h3>
    <div class="mig-grid">
      ${migTable("Call 牆 OI", "em", callSeries)}
      ${migTable("Put 牆 OI", "ro", putSeries)}
    </div>
    <div class="mu" style="font-size:.72rem;margin-top:6px">綠=較前一日增 · 紅=減 · 追蹤當日 Top 4 重貨行使價在歷史中的 OI</div>
  `;
}


function selectStock(hkats){
  curHkats=hkats;
  document.querySelectorAll(".stock-tab").forEach(b=>b.classList.toggle("active", b.dataset.hkats===hkats));
  const u=currentU(); if(!u) return;
  document.getElementById("summary").innerHTML = `
    <div class="card"><div class="label">正股收市</div><div class="value">${u.close?u.close.toFixed(2):"—"}</div><div class="subv">${u.name||""}</div></div>
    <div class="card"><div class="label">即月</div><div class="value" style="font-size:.95rem">${u.frontExpiry||"—"}</div></div>
    <div class="card"><div class="label">Call OI</div><div class="value">${fmt(u.callOI)}</div></div>
    <div class="card"><div class="label">Put OI</div><div class="value">${fmt(u.putOI)}</div></div>
    <div class="card"><div class="label">總 OI</div><div class="value">${fmt(u.oi)}</div></div>
    <div class="card"><div class="label">成交量</div><div class="value">${fmt(u.volume)}</div></div>`;
  document.getElementById("printHeader").textContent = `股票期權 OI · ${u.code} ${u.name} · ${curDate} · 收市 ${u.close}`;
  applyFilters();
  renderWallMigration(hkats, curDate);
}
function render(date){
  const r=reports[date]; if(!r){ document.getElementById("status").textContent="無資料"; return; }
  curDate=date;
  document.getElementById("status").textContent=`顯示 ${date} · ${dates.length} 個交易日 · ${STOCK_ORDER.length} 隻股票期權`;
  document.getElementById("dateSelect").innerHTML=dates.map(d=>`<option value="${d}" ${d===date?"selected":""}>${d}</option>`).join("");
  const cal=document.getElementById("dateCal"); if(cal){ cal.value=date; if(dates.length){ cal.min=dates[dates.length-1]; cal.max=dates[0]; } }
  document.getElementById("src").href=r.sourceUrl||"#";
  const order=STOCK_ORDER;
  document.getElementById("stockTabs").innerHTML=order.map(h=>{
    const u=r.underlyings[h]; if(!u) return "";
    const codeLabel=String(u.code||"").replace(/^0+/,"")||u.code;
    return `<button class="stock-tab" data-hkats="${h}" onclick="selectStock('${h}')">${codeLabel} ${u.name.split(" ")[0]}</button>`;
  }).join("");
  if(!curHkats||!r.underlyings[curHkats]) curHkats=order.find(h=>r.underlyings[h])||null;
  renderBasketHeat(date);
  if(curHkats) selectStock(curHkats);
}
if(dates.length) render(dates[0]);
else document.getElementById("status").textContent="尚未有數據。請執行 python3 fetch_stock_oi.py";


function toggleHeaderMenu(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('headerMenu');
  if(!m) return;
  m.classList.toggle('open');
}
function closeHeaderMenu(){
  const m = document.getElementById('headerMenu');
  if(m) m.classList.remove('open');
}
document.addEventListener('click', function(e){
  const m = document.getElementById('headerMenu');
  if(!m) return;
  if(!m.contains(e.target)) m.classList.remove('open');
});

</script>
