name: Update morning brief

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Hong_Kong (no DST)
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build morning-brief/data.js
        run: python3 scripts/update_morning_brief.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning-brief/data.js morning-brief/history
          if git diff --staged --quiet; then
            echo "No morning brief changes"
          else
            git commit -m "chore: morning brief $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            git push
          fi
