name: Update Stock OI
on:
  schedule:
    - cron: "55 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stock options + futures
        run: python3 stock-oi/fetch_stock_oi.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock-oi/data.js
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "update Stock OI $(date -u +%Y-%m-%d)"
            git push
          fi
