name: Update HSI Options OI Data

on:
  schedule:
    - cron: "50 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and parse latest report
        run: |
          python3 fetch_and_parse.py || true
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          python3 fetch_and_parse.py "$YESTERDAY" || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update HSI Options OI data $(date -u +%Y-%m-%d)"
            git push
          fi
