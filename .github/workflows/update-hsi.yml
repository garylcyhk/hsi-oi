name: Update HSI OI
on:
  schedule:
    - cron: "50 14 * * 1-5"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch HSI options
        run: python3 fetch_and_parse.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "update HSI OI $(date -u +%Y-%m-%d)"
          git push
