name: Update economic calendar

on:
  schedule:
    - cron: "15 23 * * *"
    - cron: "20 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh calendar/data.js
        run: python3 scripts/update_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar/data.js
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "chore: update economic calendar $(date -u +%Y-%m-%d)"
            git push
          fi
