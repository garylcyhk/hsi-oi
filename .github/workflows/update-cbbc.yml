name: Update HSI CBBC outstanding

on:
  schedule:
    - cron: "20 0 * * 1-5"
    - cron: "20 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh cbbc/data.js
        run: python3 scripts/update_cbbc.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cbbc/data.js
          if git diff --staged --quiet; then
            echo "No CBBC changes"
          else
            git commit -m "chore: update HSI CBBC outstanding $(date -u +%Y-%m-%d)"
            git push
          fi
