<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>恒指期貨 HSI / MHI Futures</title>
<style>
:root{--font-scale:100%;--bg:#09090b;--card:#18181b;--border:#27272a;--text:#fafafa;--muted:#a1a1aa;--emerald:#34d399;--rose:#fb7185;--amber:#fbbf24;--sky:#38bdf8}
html{font-size:var(--font-scale)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{border-bottom:1px solid var(--border);background:rgba(24,24,27,.92);position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;font-weight:600} h1 span{color:var(--muted);font-weight:400;font-size:.85rem}
.sub{font-size:.72rem;color:var(--muted)}
.site-nav{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.site-nav a{font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-decoration:none}
.site-nav a.active{background:#059669;color:#fff;border-color:#059669}
.site-nav a:hover:not(.active){border-color:#555;color:var(--text)}
select,input[type=date],input[type=number]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.8rem}
input[type=number]{width:90px}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:.75rem;cursor:pointer}
.btn:hover{border-color:#555}
.container{padding:12px 16px 32px;max-width:100%;margin:0 auto}
.note{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;font-size:.78rem}
.filters label{color:var(--muted);display:flex;align-items:center;gap:6px}
.filters input[type=checkbox]{accent-color:#34d399;width:14px;height:14px}
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:800px){.analysis,.fut-grid,.compare{grid-template-columns:1fr!important}}
.an-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.an-card h3{font-size:.82rem;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.an-item .l{font-size:.68rem;color:var(--muted)}.an-item .v{font-size:1.05rem;font-weight:600;font-family:ui-monospace,monospace}.an-item .s{font-size:.72rem;color:var(--muted);margin-top:2px}
.regime{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.reg{border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.reg .t{font-size:.72rem;color:var(--muted);margin-bottom:2px}.reg .n{font-size:1.2rem;font-weight:600;font-family:ui-monospace,monospace}
.reg.acc{border-color:rgba(52,211,153,.35)}.reg.dist{border-color:rgba(251,113,133,.35)}
.reg.sc{border-color:rgba(56,189,248,.35)}.reg.ll{border-color:rgba(251,191,36,.35)}
.bias{margin-top:10px;padding:8px 10px;border-radius:6px;font-size:.8rem;background:rgba(39,39,42,.6)}
.fut-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.fut-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.fut-card h2{font-size:.9rem;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:8px}
.m .l{font-size:.68rem;color:var(--muted)}.m .v{font-size:1.15rem;font-weight:600;font-family:ui-monospace,monospace}.m .s{font-size:.75rem}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.section-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.section-header h3{font-size:.85rem;font-weight:500}
.tag{font-size:.7rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:8px 12px;font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:7px 12px;border-bottom:1px solid #1f1f23}
.tr{text-align:right}.mono{font-family:ui-monospace,monospace}
.pos{color:var(--emerald)}.neg{color:var(--rose)}.mu{color:var(--muted)}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--text)} th.sortable.active{color:var(--emerald)}
tbody tr{cursor:pointer} tbody tr:hover td{background:rgba(39,39,42,.35)}
tr.row-selected td{background:rgba(16,185,129,.28)!important;box-shadow:inset 3px 0 0 #34d399}
.compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px}
.card .label{font-size:.7rem;color:var(--muted)}.card .value{font-size:1.1rem;font-weight:600;font-family:ui-monospace,monospace}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#121214;border:1px solid var(--border);border-radius:10px;padding:18px;width:min(420px,92vw);max-height:85vh;overflow:auto}
.modal h3{font-size:1rem;margin-bottom:14px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #27272a;font-size:.85rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-primary{background:#059669;border:none;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn-secondary{background:#27272a;border:none;color:var(--text);border-radius:6px;padding:7px 14px;cursor:pointer}
footer{text-align:center;padding:20px;font-size:.7rem;color:#52525b} footer a{color:var(--muted)}
@media print{.site-nav,.filters,.btn,.modal-overlay{display:none!important} body{background:#fff;color:#111}}


/* ========== Unified responsive (match HSI main) ========== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; max-width: 100vw; }
.container, .tab-panels, header .inner {
  width: 100%;
  max-width: 100%;
  margin-left: auto;
  margin-right: auto;
  padding-left: 16px;
  padding-right: 16px;
  box-sizing: border-box;
}
header { width: 100%; box-sizing: border-box; }
.filters { flex-wrap: wrap; max-width: 100%; }
.tab-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}
.section, .card, .cmp-card, .an-card, .fut-card {
  max-width: 100%;
}
.section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; max-width: 100%; }
img, svg { max-width: 100%; height: auto; }

@media (max-width: 1199px) {
  .zones { grid-template-columns: 1fr 1fr !important; }
}
@media (min-width: 1200px) {
  .zones { grid-template-columns: 1fr 1fr 1fr 1fr !important; }
}
@media (min-width: 1400px) {
  .container, .tab-panels, header .inner, .tab-bar {
    padding-left: 24px;
    padding-right: 24px;
  }
}

@media (max-width: 900px) {
  .container, .tab-panels { padding-left: 12px; padding-right: 12px; }
  header { padding-left: 12px; padding-right: 12px; }
  h1 { font-size: 1rem; }
  .grid-summary, .summary-grid { grid-template-columns: 1fr 1fr !important; }
  .cmp-grid, .analysis { grid-template-columns: 1fr !important; }
}

@media (max-width: 800px) {
  .zones, .futures-bar, .fut-grid, .compare, .lvl-grid, .dc-grid { grid-template-columns: 1fr !important; }
  .cmp-grid { grid-template-columns: 1fr !important; }
}

@media (max-width: 768px) {
  header {
    flex-direction: column !important;
    align-items: flex-start !important;
    padding: 10px 12px !important;
  }
  header .inner {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
    padding: 0 10px !important;
    width: 100%;
  }
  header > div:last-child {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-start !important;
  }
  .site-nav { width: 100%; flex-wrap: wrap; }
  .product-toggle { width: 100%; }
  .filters { padding: 8px 10px; width: 100%; }
  .filters label { font-size: 0.72rem; }
  .levels-card, .day-change .dc-grid { grid-template-columns: 1fr !important; }
  .stock-tabs { flex-wrap: wrap; width: 100%; }
  table { font-size: 0.75rem; }
  th, td { padding: 6px 8px !important; }
  .btn { padding: 6px 10px; }
  select, input[type="date"], input[type="number"], input[type="text"] {
    font-size: 16px !important;
  }
  .metrics { grid-template-columns: 1fr 1fr !important; }
  .an-grid, .regime { grid-template-columns: 1fr 1fr !important; }
  .modal { width: min(420px, 94vw) !important; }
}

@media (max-width: 480px) {
  h1 { font-size: 0.95rem; }
  h1 span { display: block; font-size: 0.72rem; margin-top: 2px; }
  .tab-btn, .prod-btn { font-size: 0.7rem; padding: 5px 8px; }
  .sub { font-size: 0.68rem; }
  .grid-summary, .summary-grid { grid-template-columns: 1fr !important; }
}

</style>
</head>
<body>
<header>
  <div>
    <h1>恒指期貨 <span>HSI / MHI Futures</span></h1>
    <div class="site-nav">
      <a href="../">恒指期權 HSI OI</a>
      <a href="../stock-oi/">股票期權 Stocks</a>
      <a class="active" href="./">期貨 Futures</a>
    </div>
    <div class="sub">港交所每日期貨報告 · 結算價 / 成交量 / 未平倉 · 趨勢分析</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <label class="mu" style="font-size:.75rem">日期</label>
    <select id="dateSelect" onchange="render(this.value)"></select>
    <input type="date" id="dateCal" onchange="onCal()" />
    <button class="btn" onclick="window.print()">🖨 列印</button>
    <button class="btn" onclick="openSettings()">⚙️ 設定</button>
  </div>
</header>

<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>設定 Settings</h3>
    <div class="modal-row"><label>字體大小</label>
      <select id="setFontScale">
        <option value="85">小 85%</option>
        <option value="100">標準 100%</option>
        <option value="115">中 115%</option>
        <option value="130">大 130%</option>
        <option value="150">更大 150%</option>
      </select>
    </div>
    <div class="modal-row"><label>分析視窗（日）</label>
      <select id="setWindow">
        <option value="10">近 10 日</option>
        <option value="15">近 15 日</option>
        <option value="20" selected>近 20 日</option>
        <option value="30">近 30 日</option>
        <option value="0">全部</option>
      </select>
    </div>
    <div class="modal-row"><label>預設最低成交量</label><input type="number" id="setMinVol" min="0" step="100" /></div>
    <div class="modal-row"><label>預設最低 OI</label><input type="number" id="setMinOI" min="0" step="100" /></div>
    <div class="modal-row"><label>隱藏無成交日</label><input type="checkbox" id="setHideZeroVol" /></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="resetSettings()">重設</button>
      <button class="btn-secondary" onclick="closeSettings()">取消</button>
      <button class="btn-primary" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="note" id="status">載入中…</div>
  <div class="filters" id="filters">
    <label>分析視窗
      <select id="winSelect" onchange="onWindowChange()">
        <option value="10">近 10 日</option>
        <option value="15">近 15 日</option>
        <option value="20" selected>近 20 日</option>
        <option value="30">近 30 日</option>
        <option value="0">全部</option>
      </select>
    </label>
    <label>最低成交量 <input type="number" id="minVol" value="0" min="0" step="100" oninput="applyFilters()" /></label>
    <label>最低 OI <input type="number" id="minOI" value="0" min="0" step="100" oninput="applyFilters()" /></label>
    <label><input type="checkbox" id="hideZeroVol" onchange="applyFilters()" /> 隱藏無成交</label>
    <label>只看 <select id="productFilter" onchange="applyFilters()">
      <option value="both">HSI + MHI</option>
      <option value="hsif">只 HSI</option>
      <option value="mhif">只 MHI</option>
    </select></label>
    <span class="tag" id="filterHint"></span>
  </div>

  <div class="analysis" id="analysis"></div>
  <div id="levelsBias" style="margin-bottom:16px;"></div>
  <div class="compare" id="compare"></div>
  <div class="fut-grid" id="frontCards"></div>
  <div id="tables"></div>
  <div id="history"></div>
  <footer>
    <p>個人交易工具 · 數據僅供參考 · 不構成投資建議</p>
    <p style="margin-top:6px">
      <a id="srcH" href="#" target="_blank" rel="noopener">HSI Futures Report</a> ·
      <a id="srcM" href="#" target="_blank" rel="noopener">MHI Futures Report</a>
    </p>
  </footer>
</div>
<script src="../stock-oi/data.js"></script>
<script src="../data.js"></script>
<script>
const reports = (typeof window.STOCK_OI === "object" && window.STOCK_OI) ? window.STOCK_OI : {};
const dates = Object.keys(reports).sort().reverse();
let curDate = dates[0] || null;
let sortKey = "month", sortDir = "asc", sortProduct = "hsif";
let histSortKey = "date", histSortDir = "desc";

const DEFAULTS = { fontScale:100, minVol:0, minOI:0, hideZeroVol:false, window:20 };
function loadSettings(){
  try { return {...DEFAULTS, ...JSON.parse(localStorage.getItem("futures_settings")||"{}")}; }
  catch(e){ return {...DEFAULTS}; }
}
let settings = loadSettings();
let fontScale = settings.fontScale || 100;
let minVol = settings.minVol || 0;
let minOI = settings.minOI || 0;
let hideZeroVol = !!settings.hideZeroVol;
let analysisWindow = settings.window != null ? settings.window : 20;
document.documentElement.style.setProperty("--font-scale", fontScale + "%");

const fmt = n => (n==null||isNaN(n))?"—":Number(n).toLocaleString("en-US");
const fmtChg = n => { if(n==null||n===0) return "0"; return (n>0?"+":"")+Number(n).toLocaleString("en-US"); };
const chgClass = n => n>0?"pos":n<0?"neg":"mu";

function openSettings(){
  document.getElementById("setFontScale").value = String(fontScale);
  document.getElementById("setWindow").value = String(analysisWindow);
  document.getElementById("setMinVol").value = minVol;
  document.getElementById("setMinOI").value = minOI;
  document.getElementById("setHideZeroVol").checked = hideZeroVol;
  document.getElementById("settingsModal").classList.add("open");
}
function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }
function saveSettings(){
  fontScale = parseInt(document.getElementById("setFontScale").value,10)||100;
  analysisWindow = parseInt(document.getElementById("setWindow").value,10);
  if(isNaN(analysisWindow)) analysisWindow = 20;
  minVol = parseInt(document.getElementById("setMinVol").value,10)||0;
  minOI = parseInt(document.getElementById("setMinOI").value,10)||0;
  hideZeroVol = document.getElementById("setHideZeroVol").checked;
  document.documentElement.style.setProperty("--font-scale", fontScale+"%");
  document.getElementById("minVol").value = minVol;
  document.getElementById("minOI").value = minOI;
  document.getElementById("hideZeroVol").checked = hideZeroVol;
  document.getElementById("winSelect").value = String(analysisWindow);
  settings = {fontScale, minVol, minOI, hideZeroVol, window:analysisWindow};
  localStorage.setItem("futures_settings", JSON.stringify(settings));
  closeSettings();
  renderAnalysis();
  renderLevelsBias();
  applyFilters();
}
function resetSettings(){
  settings = {...DEFAULTS}; fontScale=100; minVol=0; minOI=0; hideZeroVol=false; analysisWindow=20;
  document.documentElement.style.setProperty("--font-scale","100%");
  document.getElementById("minVol").value=0;
  document.getElementById("minOI").value=0;
  document.getElementById("hideZeroVol").checked=false;
  document.getElementById("winSelect").value="20";
  localStorage.setItem("futures_settings", JSON.stringify(settings));
  closeSettings(); renderAnalysis(); applyFilters();
}
function onWindowChange(){
  analysisWindow = parseInt(document.getElementById("winSelect").value,10);
  if(isNaN(analysisWindow)) analysisWindow = 20;
  settings.window = analysisWindow;
  localStorage.setItem("futures_settings", JSON.stringify(settings));
  renderAnalysis();
}

function onRowClick(tr){
  const table=tr.closest("table");
  if(table) table.querySelectorAll("tr.row-selected").forEach(r=>{ if(r!==tr) r.classList.remove("row-selected"); });
  tr.classList.toggle("row-selected");
}
function setSort(prod, key){
  if(sortProduct===prod && sortKey===key) sortDir = sortDir==="desc"?"asc":"desc";
  else { sortProduct=prod; sortKey=key; sortDir = key==="month"?"asc":"desc"; }
  render(curDate);
}
function setHistSort(key){
  if(histSortKey===key) histSortDir = histSortDir==="desc"?"asc":"desc";
  else { histSortKey=key; histSortDir="desc"; }
  renderHistory();
}
function arrow(prod, key){
  if(sortProduct!==prod || sortKey!==key) return '<span style="opacity:.4">↕</span>';
  return sortDir==="desc"?"↓":"↑";
}
function histArrow(key){
  if(histSortKey!==key) return '<span style="opacity:.4">↕</span>';
  return histSortDir==="desc"?"↓":"↑";
}
function sortMonths(months){
  const list=[...(months||[])];
  list.sort((a,b)=>{
    if(sortKey==="month"){ const va=a.month||"", vb=b.month||""; return sortDir==="desc"?vb.localeCompare(va):va.localeCompare(vb); }
    const va=+(a[sortKey]||0), vb=+(b[sortKey]||0);
    return sortDir==="desc"?vb-va:va-vb;
  });
  return list;
}
function onCal(){
  const v=document.getElementById("dateCal").value; if(!v) return;
  if(reports[v]) render(v);
  else {
    const c=dates.filter(d=>d<=v);
    if(c.length) render(c[0]); else if(dates.length) render(dates[dates.length-1]);
  }
}
function metricCard(label, value, sub, cls){
  return `<div class="m"><div class="l">${label}</div><div class="v">${value}</div>${sub!=null?`<div class="s ${cls||""}">${sub}</div>`:""}</div>`;
}
function frontCard(title, f, t){
  if(!f||!f.settle) return `<div class="fut-card"><h2>${title}</h2><div class="mu">無資料</div></div>`;
  return `<div class="fut-card">
    <h2><span>${title}</span><span class="tag">${f.month||""}</span></h2>
    <div class="metrics">
      ${metricCard("結算價", fmt(f.settle), fmtChg(f.settleChange), chgClass(f.settleChange))}
      ${metricCard("成交量", fmt(f.volume))}
      ${metricCard("未平倉", fmt(f.oi), fmtChg(f.oiChange), chgClass(f.oiChange))}
      ${metricCard("開市", fmt(f.open))}
      ${metricCard("最高", fmt(f.high))}
      ${metricCard("最低", fmt(f.low))}
      ${metricCard("全月份 OI", fmt((t&&t.oi)!=null?t.oi:f.oi), t&&t.oiChange!=null?fmtChg(t.oiChange):"", t?chgClass(t.oiChange):"")}
      ${metricCard("全月份成交", fmt((t&&t.volume)!=null?t.volume:f.volume))}
    </div>
  </div>`;
}
function getLiveFilters(){
  return {
    minVol: parseInt(document.getElementById("minVol").value,10)||0,
    minOI: parseInt(document.getElementById("minOI").value,10)||0,
    hideZero: document.getElementById("hideZeroVol").checked,
    product: document.getElementById("productFilter").value || "both",
  };
}
function filterMonths(months, f){
  return (months||[]).filter(m=>{
    const vol = +(m.volume||0), oi = +(m.oi||0);
    if(f.hideZero && vol===0) return false;
    if(vol < f.minVol) return false;
    if(oi < f.minOI) return false;
    return true;
  });
}
function monthTable(prod, title, months){
  const f = getLiveFilters();
  if(f.product==="hsif" && prod!=="hsif") return "";
  if(f.product==="mhif" && prod!=="mhif") return "";
  let rows = filterMonths(months, f);
  if(sortProduct===prod) rows = sortMonths(rows);
  else rows = [...rows];
  const th=(k,label,cls="")=>`<th class="${cls} sortable ${sortProduct===prod&&sortKey===k?"active":""}" onclick="setSort('${prod}','${k}')">${label} ${arrow(prod,k)}</th>`;
  return `<div class="section">
    <div class="section-header"><h3>${title}</h3><span class="tag">顯示 ${rows.length} / ${(months||[]).length} 月份</span></div>
    <table><thead><tr>
      ${th("month","月份")}
      ${th("settle","結算價","tr")}
      ${th("settleChange","Δ結算","tr")}
      ${th("volume","成交量","tr")}
      ${th("oi","未平倉","tr")}
      ${th("oiChange","ΔOI","tr")}
      ${th("open","開","tr")}
      ${th("high","高","tr")}
      ${th("low","低","tr")}
    </tr></thead>
    <tbody>${rows.length?rows.map(m=>`<tr onclick="onRowClick(this)">
      <td class="mono">${m.month}</td>
      <td class="tr mono">${fmt(m.settle)}</td>
      <td class="tr mono ${chgClass(m.settleChange)}">${fmtChg(m.settleChange)}</td>
      <td class="tr mono">${fmt(m.volume)}</td>
      <td class="tr mono">${fmt(m.oi)}</td>
      <td class="tr mono ${chgClass(m.oiChange)}">${fmtChg(m.oiChange)}</td>
      <td class="tr mono mu">${fmt(m.open)}</td>
      <td class="tr mono mu">${fmt(m.high)}</td>
      <td class="tr mono mu">${fmt(m.low)}</td>
    </tr>`).join(""):'<tr><td colspan="9" class="mu" style="text-align:center;padding:14px">無符合條件</td></tr>'}
    </tbody></table>
  </div>`;
}

/** Build chronological daily series (oldest → newest) from all reports with HSI front */
function buildSeries(){
  const chrono = [...dates].sort(); // ascending
  const rows = [];
  for(const d of chrono){
    const r = reports[d];
    if(!r||!r.futures) continue;
    const hf = (r.futures.hsif||{}).front||{};
    const mf = (r.futures.mhif||{}).front||{};
    if(hf.settle==null && mf.settle==null) continue;
    rows.push({
      date: d,
      hSettle: hf.settle, hChg: hf.settleChange||0, hVol: hf.volume||0, hOI: hf.oi||0, hOIChg: hf.oiChange||0,
      mSettle: mf.settle, mChg: mf.settleChange||0, mVol: mf.volume||0, mOI: mf.oi||0, mOIChg: mf.oiChange||0,
    });
  }
  return rows;
}


function renderLevelsBias(){
  const box = document.getElementById("levelsBias");
  if(!box) return;
  const hsiReports = (typeof window.HSI_REPORTS === "object" && window.HSI_REPORTS) ? window.HSI_REPORTS : {};
  // Match current futures date if possible
  const hsiDates = Object.keys(hsiReports).sort().reverse();
  const hDate = hsiDates.find(d => d === curDate) || hsiDates[0];
  const hr = hDate ? hsiReports[hDate] : null;
  if(!hr || !hr.heavyZones){
    box.innerHTML = `<div class="an-card" style="grid-column:1/-1"><div class="mu" style="font-size:0.8rem">期權牆位：請確認根目錄 data.js（HSI OI）已上傳，以便顯示 Settle vs 重貨區</div></div>`;
    return;
  }
  const settle = (reports[curDate]?.futures?.hsif?.front?.settle)
    || hr.futures?.hsif?.front?.settle
    || null;
  const allCalls = hr.heavyZones.callWalls || [];
  const allPuts = hr.heavyZones.putWalls || [];
  let nearCall = null, nearPut = null;
  if(settle != null){
    const above = allCalls.filter(z => z.strike >= settle).sort((a,b)=>a.strike-b.strike);
    const below = allPuts.filter(z => z.strike <= settle).sort((a,b)=>b.strike-a.strike);
    nearCall = above[0] || null;
    nearPut = below[0] || null;
  }
  let biasTitle = "水平待定", biasNote = "";
  if(settle != null && (nearCall || nearPut)){
    const callAbove = nearCall && nearCall.strike > settle;
    const putBelow = nearPut && nearPut.strike < settle;
    if(callAbove && putBelow){
      biasTitle = "夾在牆中";
      biasNote = `上 Call ${nearCall.strike}（+${Math.round(nearCall.strike-settle)}）· 下 Put ${nearPut.strike}（${Math.round(nearPut.strike-settle)}）`;
    } else if(callAbove){
      biasTitle = "潛在阻力在上";
      biasNote = `最近 Call ${nearCall.strike} · +${Math.round(nearCall.strike-settle)} pts`;
    } else if(putBelow){
      biasTitle = "潛在支持在下";
      biasNote = `最近 Put ${nearPut.strike} · ${Math.round(nearPut.strike-settle)} pts`;
    } else {
      biasTitle = "牆位偏離 Settle";
      biasNote = "見恒指期權頁完整 Levels";
    }
  }
  box.innerHTML = `
    <div class="an-card" style="grid-column:1/-1">
      <h3><span>Settle vs 期權牆</span><span class="tag">HSI OI · ${hDate||"—"}</span></h3>
      <div style="font-size:0.9rem;font-weight:600;margin-bottom:4px;">${biasTitle}</div>
      <div style="font-size:0.78rem;color:var(--muted);margin-bottom:8px;">${biasNote || (settle!=null?"Settle "+fmt(settle):"無 Settle")}</div>
      <div class="an-grid">
        <div class="an-item"><div class="l">期貨結算</div><div class="v">${settle!=null?fmt(settle):"—"}</div></div>
        <div class="an-item"><div class="l">Call 牆</div><div class="v pos">${nearCall?nearCall.strike:"—"}</div>
          <div class="s">${nearCall&&settle!=null?((nearCall.strike-settle>=0?"+":"")+Math.round(nearCall.strike-settle)+" pts"):""}</div></div>
        <div class="an-item"><div class="l">Put 牆</div><div class="v neg">${nearPut?nearPut.strike:"—"}</div>
          <div class="s">${nearPut&&settle!=null?((nearPut.strike-settle>=0?"+":"")+Math.round(nearPut.strike-settle)+" pts"):""}</div></div>
      </div>
      <div class="bias mu"><a href="../" style="color:var(--muted)">→ 恒指期權頁看完整 Levels</a></div>
    </div>`;
}

function renderAnalysis(){
  const box = document.getElementById("analysis");
  if(!box) return;
  const series = buildSeries();
  if(!series.length){ box.innerHTML = ""; return; }

  let win = analysisWindow;
  const slice = (win > 0 && win < series.length) ? series.slice(-win) : series;
  const n = slice.length;
  const label = win > 0 ? `近 ${n} 日` : `全部 ${n} 日`;

  // Trend counts
  let up=0, down=0, flat=0;
  let sumUp=0, sumDn=0, volUp=0, volDn=0, nUp=0, nDn=0;
  let acc=0, dist=0, sc=0, ll=0;
  for(const x of slice){
    const c = x.hChg, oc = x.hOIChg;
    if(c > 0){ up++; sumUp += c; volUp += x.hVol; nUp++; }
    else if(c < 0){ down++; sumDn += c; volDn += x.hVol; nDn++; }
    else flat++;
    if(c > 0 && oc > 0) acc++;
    else if(c < 0 && oc > 0) dist++;
    else if(c > 0 && oc < 0) sc++;
    else if(c < 0 && oc < 0) ll++;
  }

  // Current streak (from newest backwards)
  let streak = 0, streakDir = 0;
  for(let i = series.length-1; i >= 0; i--){
    const c = series[i].hChg;
    if(c === 0) break;
    const dir = c > 0 ? 1 : -1;
    if(streakDir === 0){ streakDir = dir; streak = 1; }
    else if(dir === streakDir) streak++;
    else break;
  }
  const streakText = streakDir > 0 ? `連升 ${streak} 日` : streakDir < 0 ? `連跌 ${streak} 日` : "持平";
  const streakCls = streakDir > 0 ? "pos" : streakDir < 0 ? "neg" : "mu";

  // Net settle move in window
  const net = slice.reduce((s,x)=>s+(x.hChg||0), 0);
  const avgVolUp = nUp ? Math.round(volUp/nUp) : 0;
  const avgVolDn = nDn ? Math.round(volDn/nDn) : 0;

  // Bias hint
  let bias = "中性";
  let biasNote = "升跌日數接近，或需配合期權牆位";
  if(up > down + 2 && acc >= dist){
    bias = "偏多結構";
    biasNote = "升日較多，且 Price↑OI↑（新多）不少於 Price↓OI↑";
  } else if(down > up + 2 && dist >= acc){
    bias = "偏空結構";
    biasNote = "跌日較多，且 Price↓OI↑（新空）不少於 Price↑OI↑";
  } else if(sc > acc && sc > dist){
    bias = "回補主導";
    biasNote = "升日多伴隨 OI↓，偏向短線回補而非新多";
  } else if(ll > dist && ll > acc){
    bias = "長倉平倉主導";
    biasNote = "跌日多伴隨 OI↓，偏向長倉離場";
  }

  box.innerHTML = `
    <div class="an-card">
      <h3><span>趨勢摘要 Trend</span><span class="tag">${label}</span></h3>
      <div class="an-grid">
        <div class="an-item"><div class="l">升日</div><div class="v pos">${up}</div></div>
        <div class="an-item"><div class="l">跌日</div><div class="v neg">${down}</div></div>
        <div class="an-item"><div class="l">平日</div><div class="v mu">${flat}</div></div>
        <div class="an-item"><div class="l">目前</div><div class="v ${streakCls}">${streakText}</div></div>
        <div class="an-item"><div class="l">區間淨升跌</div><div class="v ${chgClass(net)}">${fmtChg(net)}</div></div>
        <div class="an-item"><div class="l">升日均量</div><div class="v">${fmt(avgVolUp)}</div></div>
        <div class="an-item"><div class="l">跌日均量</div><div class="v">${fmt(avgVolDn)}</div></div>
      </div>
      <div class="bias"><strong>${bias}</strong> · ${biasNote}</div>
    </div>
    <div class="an-card">
      <h3><span>Price × OI 結構</span><span class="tag">HSI 即月</span></h3>
      <div class="regime">
        <div class="reg acc"><div class="t">P↑ OI↑ 新多</div><div class="n pos">${acc}</div></div>
        <div class="reg dist"><div class="t">P↓ OI↑ 新空</div><div class="n neg">${dist}</div></div>
        <div class="reg sc"><div class="t">P↑ OI↓ 回補</div><div class="n" style="color:var(--sky)">${sc}</div></div>
        <div class="reg ll"><div class="t">P↓ OI↓ 平多</div><div class="n" style="color:var(--amber)">${ll}</div></div>
      </div>
      <div class="bias mu" style="margin-top:10px">
        新多 ${acc} · 新空 ${dist} · 回補 ${sc} · 平多 ${ll}
        ${acc+dist+sc+ll < n ? ` · 其餘 ${n-(acc+dist+sc+ll)} 日 OI 不變` : ""}
      </div>
    </div>`;
}

function renderHistory(){
  const box = document.getElementById("history");
  if(!box) return;
  const f = getLiveFilters();
  let rows = dates.map(d=>{
    const r = reports[d];
    if(!r||!r.futures) return null;
    const hf = (r.futures.hsif||{}).front||{};
    const mf = (r.futures.mhif||{}).front||{};
    return {
      date:d,
      hSettle:hf.settle, hChg:hf.settleChange, hVol:hf.volume, hOI:hf.oi, hOIChg:hf.oiChange,
      mSettle:mf.settle, mChg:mf.settleChange, mVol:mf.volume, mOI:mf.oi, mOIChg:mf.oiChange,
    };
  }).filter(Boolean);

  rows = rows.filter(r=>{
    const vol = Math.max(+(r.hVol||0), +(r.mVol||0));
    const oi = Math.max(+(r.hOI||0), +(r.mOI||0));
    if(f.hideZero && vol===0) return false;
    if(vol < f.minVol) return false;
    if(oi < f.minOI) return false;
    return true;
  });

  rows.sort((a,b)=>{
    let va, vb;
    if(histSortKey==="date"){ va=a.date; vb=b.date; return histSortDir==="desc"?vb.localeCompare(va):va.localeCompare(vb); }
    va=+(a[histSortKey]||0); vb=+(b[histSortKey]||0);
    return histSortDir==="desc"?vb-va:va-vb;
  });

  document.getElementById("filterHint").textContent = `歷史 ${rows.length} / ${dates.length} 日`;
  const th=(k,label,cls="")=>`<th class="${cls} sortable ${histSortKey===k?"active":""}" onclick="setHistSort('${k}')">${label} ${histArrow(k)}</th>`;
  const showH = f.product!=="mhif";
  const showM = f.product!=="hsif";

  box.innerHTML = `<div class="section">
    <div class="section-header"><h3>每日期貨紀錄</h3><span class="tag">點列載入當日詳情 · ${rows.length} 日</span></div>
    <table><thead><tr>
      ${th("date","日期")}
      ${showH?th("hSettle","HSI結算","tr"):""}
      ${showH?th("hChg","Δ","tr"):""}
      ${showH?th("hVol","HSI量","tr"):""}
      ${showH?th("hOI","HSI OI","tr"):""}
      ${showH?th("hOIChg","ΔOI","tr"):""}
      ${showM?th("mSettle","MHI結算","tr"):""}
      ${showM?th("mChg","Δ","tr"):""}
      ${showM?th("mVol","MHI量","tr"):""}
      ${showM?th("mOI","MHI OI","tr"):""}
    </tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr onclick="render('${r.date}');onRowClick(this)">
      <td class="mono">${r.date}</td>
      ${showH?`<td class="tr mono">${fmt(r.hSettle)}</td>`:""}
      ${showH?`<td class="tr mono ${chgClass(r.hChg)}">${fmtChg(r.hChg)}</td>`:""}
      ${showH?`<td class="tr mono">${fmt(r.hVol)}</td>`:""}
      ${showH?`<td class="tr mono">${fmt(r.hOI)}</td>`:""}
      ${showH?`<td class="tr mono ${chgClass(r.hOIChg)}">${fmtChg(r.hOIChg)}</td>`:""}
      ${showM?`<td class="tr mono">${fmt(r.mSettle)}</td>`:""}
      ${showM?`<td class="tr mono ${chgClass(r.mChg)}">${fmtChg(r.mChg)}</td>`:""}
      ${showM?`<td class="tr mono">${fmt(r.mVol)}</td>`:""}
      ${showM?`<td class="tr mono">${fmt(r.mOI)}</td>`:""}
    </tr>`).join(""):'<tr><td colspan="9" class="mu" style="text-align:center;padding:14px">無符合條件</td></tr>'}
    </tbody></table>
  </div>`;
}
function applyFilters(){
  if(!curDate) return;
  const r = reports[curDate];
  if(!r||!r.futures) return;
  const h=r.futures.hsif||{}, m=r.futures.mhif||{};
  document.getElementById("tables").innerHTML =
    monthTable("hsif", "HSI 各月份", h.months) + monthTable("mhif", "MHI 各月份", m.months);
  renderHistory();
}
function render(date){
  const r=reports[date];
  if(!r){ document.getElementById("status").textContent="無此日期資料"; return; }
  if(!r.futures || (!r.futures.hsif && !r.futures.mhif)){
    document.getElementById("status").textContent="此日期無期貨欄位 — 請用新版 fetch_stock_oi.py 更新 data.js";
    document.getElementById("compare").innerHTML="";
    document.getElementById("frontCards").innerHTML="";
    document.getElementById("tables").innerHTML="";
    return;
  }
  curDate=date;
  document.getElementById("status").textContent=`顯示 ${date} · ${dates.length} 個交易日`;
  document.getElementById("dateSelect").innerHTML=dates.map(d=>`<option value="${d}" ${d===date?"selected":""}>${d}</option>`).join("");
  const cal=document.getElementById("dateCal");
  if(cal){ cal.value=date; if(dates.length){ cal.min=dates[dates.length-1]; cal.max=dates[0]; } }
  const h=r.futures.hsif||{}, m=r.futures.mhif||{};
  const hf=h.front||{}, mf=m.front||{};
  document.getElementById("srcH").href=h.sourceUrl||"#";
  document.getElementById("srcM").href=m.sourceUrl||"#";

  const basis = (hf.settle&&mf.settle)? (hf.settle-mf.settle) : null;
  const oiRatio = (hf.oi&&mf.oi)? (hf.oi/mf.oi) : null;
  document.getElementById("compare").innerHTML = `
    <div class="card"><div class="label">HSI 結算</div><div class="value">${fmt(hf.settle)}</div><div class="${chgClass(hf.settleChange)}">${fmtChg(hf.settleChange)}</div></div>
    <div class="card"><div class="label">MHI 結算</div><div class="value">${fmt(mf.settle)}</div><div class="${chgClass(mf.settleChange)}">${fmtChg(mf.settleChange)}</div></div>
    <div class="card"><div class="label">HSI−MHI / OI比</div><div class="value" style="font-size:.95rem">${basis!=null?basis:"—"} / ${oiRatio!=null?oiRatio.toFixed(1)+"x":"—"}</div>
      <div class="mu" style="font-size:.72rem">價差 · HSI OI ÷ MHI OI</div></div>`;

  document.getElementById("frontCards").innerHTML =
    frontCard("恒生指數期貨 HSI", hf, h.total) + frontCard("小型恒指期貨 MHI", mf, m.total);
  renderAnalysis();
  renderLevelsBias();
  applyFilters();
}

document.getElementById("minVol").value = minVol;
document.getElementById("minOI").value = minOI;
document.getElementById("hideZeroVol").checked = hideZeroVol;
document.getElementById("winSelect").value = String(analysisWindow);

if(dates.length) {
  const withFut = dates.find(d => reports[d] && reports[d].futures && (reports[d].futures.hsif || reports[d].futures.mhif));
  if (withFut) render(withFut);
  else {
    document.getElementById("status").textContent =
      "已載入 " + dates.length + " 日股票數據，但沒有期貨欄位。請上傳含 futures 的 stock-oi/data.js。";
  }
} else {
  document.getElementById("status").textContent =
    "讀不到 stock-oi/data.js。請確認路徑 /hsi-oi/stock-oi/data.js";
}
</script>
